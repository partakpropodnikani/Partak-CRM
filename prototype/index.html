<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parťák pro podnikání · Operační systém firmy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1814; --ink-1:#2A2620; --ink-2:#4B463D; --ink-3:#8C8579;
  --gold:#C9A96E; --gold-2:#DBC291; --gold-soft:#F1E8D4; --gold-deep:#A6854B;
  --wood:#D4C4A8; --concrete:#E8E4DE;
  --paper:#F7F4EF; --paper-2:#FCFAF6; --white:#FFFFFF;
  --line:#E7E1D4; --line-2:#D3CBBA;
  --ok:#2E6B4F; --ok-bg:#E8F1EB; --warn:#96690F; --warn-bg:#FBF1DC;
  --bad:#96302A; --bad-bg:#F8E7E4; --info:#3E5C76; --info-bg:#E7EDF3;
  --f-d:'Jost','DM Sans',sans-serif; --f-b:'DM Sans',-apple-system,'Segoe UI',sans-serif;
  --f-m:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:4px; --sb:252px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--f-b);background:var(--paper);color:var(--ink);font-size:14.5px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--ink);text-decoration-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#app{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:0 0 var(--sb);background:var(--ink);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-top{padding:22px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.sb-mark{font-family:var(--f-d);font-size:20px;font-weight:500;letter-spacing:.32em;line-height:1.1;color:#fff}
.sb-rule{width:44px;height:2px;background:var(--gold);margin:8px 0 7px}
.sb-sub{font-family:var(--f-d);font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.sb-nav{flex:1;padding:12px 10px}
.nav-sec{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.34);padding:14px 8px 6px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--r);color:rgba(255,255,255,.84);font-size:14px;transition:background .12s,color .12s;width:100%;text-align:left}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i.on{background:var(--gold);color:var(--ink);font-weight:600}
.nav-i .gl{width:16px;text-align:center;font-size:12px;opacity:.85}
.nav-i.on .gl{opacity:1}
.nbadge{margin-left:auto;background:rgba(255,255,255,.16);font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;font-family:var(--f-m)}
.nav-i.on .nbadge{background:rgba(26,24,20,.18)}
.nbadge.hot{background:var(--bad);color:#fff}
.nav-i.on .nbadge.hot{background:var(--bad);color:#fff}
.sb-foot{padding:12px 14px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:rgba(255,255,255,.45)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:var(--paper-2);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.top h1{font-family:var(--f-d);font-size:20px;font-weight:500;letter-spacing:.02em}
.top .crumb{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:0}
.top-act{margin-left:auto;display:flex;gap:8px;align-items:center}
.wrap{padding:24px 30px 70px;max-width:1220px}
.btn{padding:9px 15px;border-radius:var(--r);font-size:13.5px;font-weight:500;border:1px solid transparent;transition:.12s;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn-p{background:var(--ink);color:#fff}.btn-p:hover{background:var(--ink-1)}
.btn-g{background:var(--gold);color:var(--ink);font-weight:600}.btn-g:hover{background:var(--gold-2)}
.btn-o{background:transparent;border-color:var(--line-2);color:var(--ink-2)}.btn-o:hover{border-color:var(--ink);color:var(--ink)}
.btn-d{background:transparent;border-color:transparent;color:var(--bad)}.btn-d:hover{background:var(--bad-bg)}
.btn-s{padding:6px 11px;font-size:12.5px}
.btn-xs{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.card-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.card-h h2{font-family:var(--f-d);font-size:16px;font-weight:500;letter-spacing:.02em}
.card-h .sub{font-size:12px;color:var(--ink-3)}
.card-b{padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1000px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.g2,.g3,.g4{grid-template-columns:1fr}}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.hr{height:1px;background:var(--line);margin:14px 0}
.right{text-align:right}
.stat{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;display:block;width:100%;text-align:left;transition:border-color .12s}
button.stat:hover{border-color:var(--gold-deep)}
.stat .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--f-d);font-size:27px;font-weight:500;margin-top:4px;line-height:1;letter-spacing:0}
.stat .n{font-size:11.5px;color:var(--ink-3);margin-top:5px}
.stat.acc{border-left:3px solid var(--gold)}
.stat.bad .v{color:var(--bad)}
.stat.warn .v{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}.p-n{background:#ECE8DF;color:var(--ink-2)}
.p-ink{background:var(--ink);color:#fff}.p-gold{background:var(--gold-soft);color:#7A5B1E}
.p-info{background:var(--info-bg);color:var(--info)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:hover{background:var(--paper-2)}
tbody tr.click{cursor:pointer}
.num{text-align:right;font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.f{margin-bottom:12px}
.f label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:8px 11px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);font-size:13.5px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(201,169,110,.18)}
.f textarea{min-height:84px;resize:vertical;line-height:1.5}
.f .hint{font-size:11px;color:var(--ink-3);margin-top:3px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:680px){.frow,.frow3{grid-template-columns:1fr}}
.ov{position:fixed;inset:0;background:rgba(26,24,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:100;overflow-y:auto}
.mod{background:var(--paper-2);border-radius:6px;width:100%;max-width:640px;box-shadow:0 18px 60px rgba(26,24,20,.3);border:1px solid var(--line)}
.mod.wide{max-width:840px}
.mod-h{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mod-h h3{font-family:var(--f-d);font-size:17px;font-weight:500;letter-spacing:.02em;flex:1}
.mod-b{padding:20px 22px;max-height:64vh;overflow-y:auto}
.mod-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200}
.toast{background:var(--ink);color:#fff;padding:10px 18px;border-radius:4px;font-size:13.5px;box-shadow:0 8px 26px rgba(26,24,20,.35);animation:tin .18s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{padding:34px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.empty .big{font-family:var(--f-d);font-size:17px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.own{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:700;color:#fff;background:var(--ink-2);flex:0 0 24px}
.own.sm{width:20px;height:20px;font-size:10px;flex-basis:20px}
.fz{display:flex;gap:3px;align-items:center}
.fz i{flex:1;height:5px;border-radius:2px;background:var(--concrete)}
.fz i.on{background:var(--gold)}
.fz i.now{background:var(--gold-deep)}
.fz-lbl{font-size:10.5px;color:var(--ink-3);margin-top:4px;display:flex;justify-content:space-between}
.stepper{display:flex;flex-wrap:wrap;gap:6px}
.step{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-2);border-radius:20px;font-size:11.5px;color:var(--ink-2);background:var(--white);cursor:pointer;transition:.12s}
.step:hover{border-color:var(--gold-deep)}
.step .no{font-family:var(--f-m);font-size:10px;color:var(--ink-3)}
.step.done{background:var(--gold-soft);border-color:var(--gold);color:#6E5320}
.step.done .no{color:#A6854B}
.step.now{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.step.now .no{color:var(--gold)}
.prog{height:6px;background:var(--concrete);border-radius:3px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--gold);border-radius:3px}
.prog b.over{background:var(--bad)}
.prog b.okc{background:var(--ok)}
.kan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:1050px){.kan{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.kan{grid-template-columns:1fr}}
.kan-col{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r)}
.kan-h{padding:10px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.kan-h .t{font-family:var(--f-d);font-size:13.5px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.kan-b{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:60px}
.kcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;cursor:pointer;transition:border-color .12s}
.kcard:hover{border-color:var(--gold-deep)}
.kcard .nm{font-weight:600;font-size:13.5px}
.kcard .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kcard .ft{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:13px}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:border-color .12s,box-shadow .12s;display:flex;flex-direction:column;gap:9px}
.pcard:hover{border-color:var(--gold-deep);box-shadow:0 3px 14px rgba(26,24,20,.06)}
.pcard .nm{font-weight:600;font-size:14.5px;line-height:1.35}
.pcard .cl{font-size:12px;color:var(--ink-3)}
.pcard .row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{padding:5px 12px;border:1px solid var(--line-2);border-radius:20px;font-size:12.5px;color:var(--ink-2);background:var(--white);transition:.12s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.sel{background:var(--gold-soft);border-color:var(--gold-deep);color:#6E5320;font-weight:600}
.ck{display:flex;align-items:flex-start;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:none}
.ck input[type=checkbox]{width:15px;height:15px;margin-top:3px;accent-color:var(--gold-deep);cursor:pointer}
.ck .t{flex:1;font-size:13.5px}
.ck.done .t{color:var(--ink-3);text-decoration:line-through}
.ck .meta{font-size:11px;color:var(--ink-3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.al{display:flex;gap:11px;padding:11px 14px;border:1px solid var(--line);border-left-width:3px;border-radius:var(--r);background:var(--white);align-items:flex-start;cursor:pointer}
.al:hover{border-color:var(--gold-deep);border-left-color:inherit}
.al .ic{font-size:14px;margin-top:1px}
.al .tx{flex:1;font-size:13px}
.al .tx b{display:block;font-size:13.5px}
.al.bad{border-left-color:var(--bad)}.al.warn{border-left-color:var(--warn)}.al.info{border-left-color:var(--info)}
.stars{color:var(--gold-deep);letter-spacing:2px;font-size:13px}
.hero{background:var(--ink);color:#fff;border-radius:6px;padding:22px 26px;margin-bottom:18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.hero .hi{font-family:var(--f-d);font-size:21px;font-weight:400;letter-spacing:.02em}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.6);margin-top:2px}
.hero .gr{width:38px;height:2px;background:var(--gold);margin-top:9px}
.hero .kpr{margin-left:auto;text-align:right}
.hero .kpr .b{font-family:var(--f-d);font-size:26px;color:var(--gold)}
.hero .kpr .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5)}
/* oznámení */
.ozn{display:flex;gap:11px;align-items:flex-start;background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:11px 15px;margin-bottom:10px}
.ozn.dulezite{background:var(--warn-bg);border-color:var(--warn)}
.ozn .tx{flex:1;font-size:13.5px}
.ozn .meta{font-size:11px;color:var(--ink-3)}
/* accordion úkoly */
.acc-h{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:13px}
.acc-h:hover{color:var(--gold-deep)}
.acc-h .chev{font-size:10px;transition:transform .12s;color:var(--ink-3)}
.acc-h.open .chev{transform:rotate(90deg)}
.acc-h .cnt{margin-left:auto;font-family:var(--f-m);font-size:11px;color:var(--ink-3);font-weight:400}
/* multi výběr služeb */
.msel{display:flex;gap:6px;flex-wrap:wrap}
.msel .chip{user-select:none}
/* zprávy */
.msgs{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px 2px}
.msg{max-width:78%;padding:8px 12px;border-radius:10px;font-size:13.5px;line-height:1.45}
.msg .mm{font-size:10.5px;color:var(--ink-3);margin-top:3px}
.msg.klient{align-self:flex-start;background:var(--white);border:1px solid var(--line-2)}
.msg.partak{align-self:flex-end;background:var(--ink);color:#fff}
.msg.partak .mm{color:rgba(255,255,255,.55)}
/* portál */
.portal-hero{background:var(--ink);color:#fff;border-radius:6px;padding:26px 28px;margin-bottom:18px}
.portal-hero .pm{font-family:var(--f-d);letter-spacing:.3em;font-size:16px}
.portal-hero .pr{width:38px;height:2px;background:var(--gold);margin:8px 0 6px}
.portal-hero .ps{font-size:12px;color:rgba(255,255,255,.6)}
.portal-note{background:var(--info-bg);border:1px solid var(--info);border-radius:var(--r);padding:9px 13px;font-size:12.5px;color:var(--info);margin-bottom:14px}
.login-box{max-width:420px;margin:40px auto}
/* tisk smluv */
#printdoc{display:none}
@media print{
  body>#app,#modal,#toast{display:none!important}
  #printdoc{display:block!important;font-family:Georgia,'Times New Roman',serif;font-size:12.5pt;line-height:1.65;color:#000;padding:0;white-space:pre-wrap}
  #printdoc h1{font-size:17pt;margin-bottom:14pt;font-family:Georgia,serif}
}
@media print{.sb,.top-act,#toast{display:none}}
</style>
</head>
<body>
<div id="app">
  <aside class="sb">
    <div class="sb-top">
      <div class="sb-mark">PARŤÁK</div>
      <div class="sb-rule"></div>
      <div class="sb-sub">pro podnikání</div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot" id="sbfoot"></div>
  </aside>
  <div class="main">
    <header class="top">
      <div><div class="crumb" id="crumb"></div><h1 id="ttl"></h1></div>
      <div class="top-act" id="topact"></div>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<div id="printdoc"></div>
<script src="v12-addon.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════
   PARŤÁK CRM · v1.1
   Projekt je hlavní objekt. Klient je kontext. Služby jsou vrstvy projektu.
   ═══════════════════════════════════════════════════════════════ */

/* ═══ 1. POMOCNÍCI ═══ */
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const dnesISO=()=>new Date().toISOString().slice(0,10);
function dat(s){if(!s)return '—';const d=new Date(s);if(isNaN(d))return '—';return d.toLocaleDateString('cs-CZ',{day:'numeric',month:'numeric',year:'numeric'});}
function poDni(iso){if(!iso)return 9999;const a=new Date(dnesISO()),b=new Date(iso);return Math.round((b-a)/864e5);}
function pred(iso){if(!iso)return 9999;return -poDni(iso.slice(0,10));}
const kc=n=>(n==null||isNaN(n))?'—':Number(n).toLocaleString('cs-CZ')+' Kč';
const h1=n=>(Math.round((n||0)*10)/10).toLocaleString('cs-CZ');
function mesicISO(d){return (d||dnesISO()).slice(0,7);}
function tydenOd(){const d=new Date();const den=(d.getDay()+6)%7;d.setDate(d.getDate()-den);return d.toISOString().slice(0,10);}
function tydenDo(){const d=new Date(tydenOd());d.setDate(d.getDate()+6);return d.toISOString().slice(0,10);}
function plusDni(iso,n){const d=new Date(iso||dnesISO());d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function nazevMesice(m){const [r,me]=m.split('-');return ['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'][+me-1]+' '+r;}

/* ═══ 2. ČÍSELNÍKY A ŠABLONY ═══ */
const FAZE=['Intake','Analýza','Návrh řešení','Nabídka','Příprava','Realizace','Kontrola','Předání','Vyhodnocení','Follow-up'];

const KEY='partak-crm-v1';

let D=null, ULOZ='paměť', BOOT_VZORY=false;
function lsOk(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true;}catch(e){return false;}}
function zalohujStara(txt){if(!txt)return;
  try{if(lsOk())localStorage.setItem(KEY+'-zaloha',txt);}catch(e){}
  try{if(window.storage)window.storage.set(KEY+'-zaloha',txt);}catch(e){}}
async function nacti(){
  try{
    if(window.storage){
      const r=await window.storage.get(KEY);
      if(r&&r.value){
        try{D=JSON.parse(r.value);ULOZ='trvalé';
          if(!D||D.__reset!==RESET_TOKEN){zalohujStara(r.value);D=seed();D.__reset=RESET_TOKEN;BOOT_VZORY=true;uloz();}
          return;
        }catch(e){zalohujStara(r.value);D=seed();D.__reset=RESET_TOKEN;ULOZ='trvalé';BOOT_VZORY=true;uloz();return;}
      }
    }
  }catch(e){}
  try{
    if(lsOk()){
      const v=localStorage.getItem(KEY);
      if(v){
        try{D=JSON.parse(v);ULOZ='prohlížeč';
          if(!D||D.__reset!==RESET_TOKEN){zalohujStara(v);D=seed();D.__reset=RESET_TOKEN;BOOT_VZORY=true;uloz();}
          return;
        }catch(e){zalohujStara(v);D=seed();D.__reset=RESET_TOKEN;ULOZ='prohlížeč';BOOT_VZORY=true;uloz();return;}
      }
    }
  }catch(e){}
  D=seed();D.__reset=RESET_TOKEN;BOOT_VZORY=true;
  if(window.storage){ULOZ='trvalé';uloz();}
  else if(lsOk()){ULOZ='prohlížeč';uloz();}
  else ULOZ='paměť (bez ukládání)';
}
let ulozTimer=null,ULOZ_CHYBA=null;
function uloz(){
  clearTimeout(ulozTimer);
  ulozTimer=setTimeout(async()=>{
    const txt=JSON.stringify(D);let ok=false;
    try{if(window.storage){await window.storage.set(KEY,txt);ok=true;}}catch(e){}
    if(!ok){
      try{if(lsOk()){localStorage.setItem(KEY,txt);ok=true;if(ULOZ!=='prohlížeč')ULOZ='prohlížeč';}}
      catch(e){ULOZ_CHYBA='Úložiště je plné. Zálohuj data v Adminu a promaž staré záznamy.';try{toast(ULOZ_CHYBA);}catch(_){}}
    }
    if(ok&&ULOZ_CHYBA)ULOZ_CHYBA=null;
  },250);
}
function stavUloziste(){
  let velikost=0;try{velikost=JSON.stringify(D).length;}catch(e){}
  let obsazeno=velikost;
  try{if(lsOk())Object.keys(localStorage).forEach(k=>{obsazeno+=(localStorage.getItem(k)||'').length;});}catch(e){}
  const limit=5*1024*1024;
  return {velikost,obsazeno,limit,pct:Math.min(100,obsazeno/limit*100),varovani:obsazeno>limit*.75};
}

/* ═══ 5. MIGRACE ═══ */
function migruj(){
  if(!D.uzivatele||!D.uzivatele.length)D.uzivatele=prazdnaData().uzivatele;
  ['leady','klienti','projekty','ukoly','cas','schuzky','partneri','faktury','smlouvy','zpravy','oznameni','portalUcty'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[];});
  if(!D.kb)D.kb={metodiky:kbMetodikyDef(),sablony:kbSablonyDef(),sluzby:kbSluzbyDef()};
  ['metodiky','sablony','sluzby'].forEach(k=>{if(!Array.isArray(D.kb[k]))D.kb[k]=[];});
  /* v2: doplnit vzory smluv, pokud chybí */
  const mameSml=D.kb.sablony.some(s=>s.kat==='Smlouva');
  if(!mameSml)kbSablonyDef().filter(s=>s.kat==='Smlouva').forEach(s=>D.kb.sablony.push(s));
  if(!D.ciselniky)D.ciselniky={};
  Object.keys(CIS_DEF).forEach(k=>{if(!Array.isArray(D.ciselniky[k])||!D.ciselniky[k].length)D.ciselniky[k]=CIS_DEF[k].slice();});
  if(!D.ciselniky.zdroje.includes('Klientský portál'))D.ciselniky.zdroje.push('Klientský portál');
  if(!Array.isArray(D.typy)||!D.typy.length)D.typy=JSON.parse(JSON.stringify(TYPY_DEF));
  if(!D.typy.some(t=>t.id==='crm'))D.typy.splice(3,0,JSON.parse(JSON.stringify(TYPY_DEF.find(t=>t.id==='crm'))));
  if(!D.ja)D.ja=D.uzivatele[0].id;
  /* v2 migrace entit */
  D.projekty.forEach(p=>{
    if(!Array.isArray(p.sluzby)||!p.sluzby.length)p.sluzby=p.typ?[p.typ]:['jine'];
    p.typ=p.sluzby[0];
    if(!Array.isArray(p.partneri))p.partneri=[];
    p.partneri=p.partneri.map(x=>typeof x==='string'?{partnerId:x,hodnota:null,datum:p.vytvoreno||dnesISO(),pozn:''}:x);
    if(!Array.isArray(p.vystupy))p.vystupy=[];
    if(!Array.isArray(p.dokumenty))p.dokumenty=[];
    if(!Array.isArray(p.historie))p.historie=[];
    if(!p.faze)p.faze=1;
    if(!p.posledniAktivita)p.posledniAktivita=p.vytvoreno||dnesISO();
  });
  D.leady.forEach(l=>{
    if(!Array.isArray(l.potencialy))l.potencialy=l.potencial?[l.potencial]:[];
    delete l.potencial;
  });
  D.klienti.forEach(k=>{if(k.spravce==null)k.spravce='';});
  D.schuzky.forEach(s=>{if(s.vlastnik==null)s.vlastnik='';});
  D.partneri.forEach(pa=>{
    if(!Array.isArray(pa.dokumenty))pa.dokumenty=[];
    if(pa.spravce==null)pa.spravce='';
    if(pa.provizePct===undefined){
      const m=/(\d+)\s*%/.exec(pa.provize||'');
      pa.provizePct=m&&PROVIZE_STUPNE.includes(+m[1])?+m[1]:null;
      if(pa.provize&&pa.provize!=='—'&&!m)pa.pozn=((pa.pozn||'')+'\nProvize (pův.): '+pa.provize).trim();
      delete pa.provize;
    }
    if(pa.kapacitaProj===undefined)pa.kapacitaProj=null;
  });
  D.portalUcty.forEach(u=>{if(!u.zona)u.zona={cena:true,dokumenty:true,zpravy:true,navody:true};});
  D.kb.sluzby.forEach(s=>{if(s.prinos===undefined)s.prinos='';});
}

/* ═══ 6. VÝBĚRY A PRÁVA ═══ */
const uz=id=>D.uzivatele.find(u=>u.id===id);
const JA=()=>uz(D.ja)||D.uzivatele[0];
const klient=id=>D.klienti.find(k=>k.id===id);
const projekt=id=>D.projekty.find(p=>p.id===id);
const partner=id=>D.partneri.find(p=>p.id===id);
const typProjektu=id=>D.typy.find(t=>t.id===id);
const nazevTypu=id=>{const t=typProjektu(id);return t?t.nazev:id;};
const nazevSluzeb=p=>(p.sluzby||[]).map(nazevTypu).join(' + ')||'—';
function inic(j){return (j||'?').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();}
function ownHtml(id,sm){const u=uz(id);if(!u)return '<span class="own'+(sm?' sm':'')+'" style="background:#B7B0A3">—</span>';
  return '<span class="own'+(sm?' sm':'')+'" style="background:'+u.barva+'" title="'+esc(u.jmeno)+'">'+esc(inic(u.jmeno))+'</span>';}
function role(){return JA().role;}
function smimAdmin(){return role()==='admin';}
function smimFinance(){return role()==='admin';}
function smimOznameni(){return ['admin','clen'].includes(role());}
function viditelneProjekty(){
  const r=role();
  if(r==='admin'||r==='clen')return D.projekty.filter(p=>!p.archiv);
  if(r==='it')return D.projekty.filter(p=>!p.archiv&&((p.sluzby||[]).some(s=>['web','it','crm'].includes(s))||p.pm===D.ja||p.odpovedny===D.ja||D.ukoly.some(t=>t.projektId===p.id&&t.vlastnik===D.ja)));
  return D.projekty.filter(p=>!p.archiv&&(p.pm===D.ja||p.odpovedny===D.ja||D.ukoly.some(t=>t.projektId===p.id&&t.vlastnik===D.ja)));
}
function projektViditelny(id){return viditelneProjekty().some(p=>p.id===id);}
/* provize */
function provizeZaznamu(z){const pa=partner(z.partnerId);
  if(!pa||pa.provizePct==null||!z.hodnota)return null;
  return z.hodnota*pa.provizePct/100;}
function partnerAktivniProjekty(paId){return D.projekty.filter(p=>!p.archiv&&!['Dokončeno','Archiv'].includes(p.stav)&&(p.partneri||[]).some(z=>z.partnerId===paId));}
/* ═══ 7. ODVOZENÉ VÝPOČTY ═══ */
function hodinyProjektu(pid){return D.cas.filter(c=>c.projektId===pid).reduce((s,c)=>s+(+c.hodiny||0),0);}
function ukolyProjektu(pid){return D.ukoly.filter(t=>t.projektId===pid);}
function otevreneUkoly(pid){return ukolyProjektu(pid).filter(t=>!t.hotovo);}
function naplanovano(uidU,dni){const doD=plusDni(dnesISO(),dni||7);
  return D.ukoly.filter(t=>!t.hotovo&&t.vlastnik===uidU&&t.termin&&t.termin<=doD).reduce((s,t)=>s+(+t.odhadH||0),0);}
function aktivniProjekty(){return D.projekty.filter(p=>!p.archiv&&!['Dokončeno','Archiv'].includes(p.stav));}
function zapisHistorii(p,text){if(!p.historie)p.historie=[];p.historie.unshift({datum:dnesISO(),text});p.posledniAktivita=dnesISO();}
function neprecteneZpravy(){return D.zpravy.filter(z=>z.od==='klient'&&!z.precteno);}
function platnaOznameni(){const dnes=dnesISO();return D.oznameni.filter(o=>!o.platnostDo||o.platnostDo>=dnes);}

/* ═══ 8. MOTOR UPOZORNĚNÍ ═══ */
function upozorneni(){
  const u=[];const dnes=dnesISO();
  D.ukoly.filter(t=>!t.hotovo&&t.termin&&t.termin<dnes).forEach(t=>{
    const p=projekt(t.projektId);
    u.push({typ:'bad',ic:'!',t:'Úkol po termínu',x:t.nazev+(p?' · '+p.nazev:''),akce:()=>jdi('ukoly',null,'poTerminu'),klic:'ukol'});});
  aktivniProjekty().forEach(p=>{
    if(p.stav==='Čeká na klienta'&&pred(p.posledniAktivita)>=7)
      u.push({typ:'warn',ic:'⏸',t:'Dlouho čeká na klienta',x:p.nazev+' · '+pred(p.posledniAktivita)+' dní bez pohybu',akce:()=>jdi('projekt',p.id),klic:'ceka'});
    else if(pred(p.posledniAktivita)>=14)
      u.push({typ:'warn',ic:'∅',t:'Projekt bez aktivity',x:p.nazev+' · '+pred(p.posledniAktivita)+' dní',akce:()=>jdi('projekt',p.id),klic:'aktivita'});
    if(p.rozpocetH&&hodinyProjektu(p.id)>p.rozpocetH)
      u.push({typ:'bad',ic:'⌛',t:'Překročen rozpočet hodin',x:p.nazev+' · '+h1(hodinyProjektu(p.id))+' z '+p.rozpocetH+' h',akce:()=>jdi('projekt',p.id,'cas'),klic:'rozpocet'});
    if(p.deadline&&poDni(p.deadline)>=0&&poDni(p.deadline)<=7)
      u.push({typ:'warn',ic:'◔',t:'Blíží se deadline',x:p.nazev+' · '+dat(p.deadline),akce:()=>jdi('projekt',p.id),klic:'deadline'});
    if(p.deadline&&poDni(p.deadline)<0)
      u.push({typ:'bad',ic:'◔',t:'Deadline projektu prošel',x:p.nazev+' · '+dat(p.deadline),akce:()=>jdi('projekt',p.id),klic:'deadline'});
    if(!p.pm)u.push({typ:'info',ic:'?',t:'Projekt bez projektového manažera',x:p.nazev,akce:()=>jdi('projekt',p.id),klic:'pm'});
  });
  D.leady.forEach(l=>{
    if(!l.konvertovanoKlient&&(!l.dalsiKrokDatum||l.dalsiKrokDatum<dnes))
      u.push({typ:'warn',ic:'◇',t:'Lead bez dalšího kroku',x:l.nazev+(l.dalsiKrok?' · '+l.dalsiKrok:''),akce:()=>jdi('obchod'),klic:'lead'});});
  D.uzivatele.forEach(us=>{const n=naplanovano(us.id,7);
    if(us.kapacita&&n>us.kapacita)
      u.push({typ:'bad',ic:'▲',t:'Přetížená kapacita',x:us.jmeno+' · naplánováno '+h1(n)+' h při kapacitě '+us.kapacita+' h/týden',akce:()=>jdi('tym'),klic:'kapacita'});});
  D.faktury.filter(f=>f.stav==='vystavena'&&f.splatnost&&f.splatnost<dnes).forEach(f=>{
    const p=projekt(f.projektId);
    u.push({typ:'bad',ic:'₵',t:'Faktura po splatnosti',x:f.cislo+' · '+kc(f.castka)+(p?' · '+p.nazev:''),akce:()=>jdi('finance'),klic:'faktura'});});
  /* v2: zprávy z portálu a smlouvy */
  const nz=neprecteneZpravy();
  const poKlientech={};nz.forEach(z=>{poKlientech[z.klientId]=(poKlientech[z.klientId]||0)+1;});
  Object.keys(poKlientech).forEach(kid=>{const k=klient(kid);
    u.push({typ:'info',ic:'✉',t:'Nová zpráva z portálu',x:(k?k.nazev:'Klient')+' · '+poKlientech[kid]+' nepřečtených',akce:()=>jdi('klient',kid),klic:'zprava'});});
  D.smlouvy.filter(s=>s.stav==='odesláno'&&pred(s.vytvoreno)>=7).forEach(s=>{
    const e=s.strana==='klient'?klient(s.stranaId):partner(s.stranaId);
    u.push({typ:'warn',ic:'✎',t:'Smlouva čeká na podpis',x:s.typ+' · '+((e&&(e.nazev||e.jmeno))||'—')+' · '+pred(s.vytvoreno)+' dní',akce:()=>jdi('smlouvy'),klic:'smlouva'});});
  return u;
}

const NAV=[

 {s:'Obchod',i:[['obchod','◇','Pipeline'],['klienti','◉','Klienti']]},
 {s:'Realizace',i:[['projekty','▤','Projekty'],['partneri','⚭','Partneři'],['tym','⚉','Tým']]},
 {s:'Firma',i:[['finance','₵','Finance'],['smlouvy','✎','Smlouvy'],['reporting','▥','Reporting'],['kb','✍','Knowledge Base'],['alerty','◎','Upozornění','al'],['audit','◫','Audit']]},
 {s:'',i:[['admin','⚙','Admin']]}
];
let route='dashboard',arg=null,sub=null;
let PORTAL_SESSION=null;
function jdi(r,a,s){route=r;arg=a||null;sub=s||null;window.scrollTo(0,0);render();}
function navPovolena(id){
  const r=role();
  if(r==='admin')return true;
  if(id==='audit')return false;
  if(r==='clen')return !['admin','finance'].includes(id);
  if(r==='it')return ['dashboard','rizika','ukoly','schuzky','projekty','kb'].includes(id);
  return ['dashboard','ukoly','projekty'].includes(id);
}
function navHtml(){
  const urg=D.ukoly.filter(t=>!t.hotovo&&t.vlastnik===D.ja&&t.termin&&poDni(t.termin)<=1).length;
  const al=upozorneni().length;
  return NAV.map(g=>{
    const items=g.i.filter(it=>navPovolena(it[0]));
    if(!items.length)return '';
    return (g.s?'<div class="nav-sec">'+g.s+'</div>':'<div style="height:10px"></div>')+items.map(it=>{
      let badge='';
      if(it[3]==='urg'&&urg)badge='<span class="nbadge hot">'+urg+'</span>';
      if(it[3]==='al'&&al)badge='<span class="nbadge'+(upozorneni().some(x=>x.typ==='bad')?' hot':'')+'">'+al+'</span>';
      if(it[3]==='rz'&&typeof zdravi==='function'){const rz=aktivniProjekty().filter(p=>zdravi(p).stupen==='cervena').length;if(rz)badge='<span class="nbadge hot">'+rz+'</span>';}
      const on=route===it[0]||(it[0]==='projekty'&&route==='projekt')||(it[0]==='klienti'&&route==='klient');
      return '<button class="nav-i'+(on?' on':'')+'" onclick="jdi(\''+it[0]+'\')"><span class="gl">'+it[1]+'</span><span style="flex:1">'+it[2]+'</span>'+badge+'</button>';
    }).join('');
  }).join('');
}

 obchod:['Obchod','Pipeline'],klienti:['Obchod','Klienti'],klient:['Obchod','Detail klienta'],
 projekty:['Realizace','Projekty'],projekt:['Realizace','Detail projektu'],partneri:['Realizace','Partneři'],tym:['Realizace','Tým a kapacita'],
 finance:['Firma','Finance'],smlouvy:['Firma','Smlouvy'],reporting:['Firma','Reporting'],kb:['Firma','Knowledge Base'],alerty:['Firma','Upozornění'],
 admin:['','Administrace'],portal:['Klientský portál','Zóna klienta'],portalLogin:['Klientský portál','Přihlášení']};

    D.uzivatele.map(u=>'<option value="'+u.id+'"'+(u.id===D.ja?' selected':'')+' style="color:#1A1814">'+esc(u.jmeno)+'</option>').join('')+'</select>'+

  document.getElementById('topact').innerHTML=topAkce();
  const v=document.getElementById('view');
  const fn={dashboard:vDash,ukoly:vUkoly,schuzky:vSchuzky,obchod:vObchod,klienti:vKlienti,klient:vKlient,
    projekty:vProjekty,projekt:vProjekt,partneri:vPartneri,tym:vTym,finance:vFinance,smlouvy:vSmlouvy,reporting:vReporting,
    kb:vKB,alerty:vAlerty,admin:vAdmin,portal:vPortal,portalLogin:vPortalLogin,
    rizika:(typeof vRizika==='function'?vRizika:null),audit:(typeof vAudit==='function'?vAudit:null)}[route];
  try{v.innerHTML=fn?fn():'<div class="empty">Neznámá stránka</div>';}
  catch(e){
    v.innerHTML='<div class="card" style="border-left:3px solid var(--bad)"><div class="card-h"><h2>Stránku se nepodařilo zobrazit</h2></div>'+
    '<div class="card-b"><p style="font-size:13px">Chyba: '+esc(e.message)+'. Ostatní části aplikace fungují — zkus jinou stránku, případně v Adminu zálohuj data.</p>'+
    '<div style="margin-top:10px"><button class="btn btn-o btn-s" onclick="jdi(\'dashboard\')">Na přehled</button></div></div></div>';
    try{console.error('render',route,e);}catch(_){}
  }
}

function topAkce(){
  const M={klienti:['formKlient()','Nový klient'],obchod:['formLead()','Nový lead'],projekty:['formProjekt()','Nový projekt'],

let MSEL={};
function mselHtml(id,vybrane){
  MSEL[id]=(vybrane||[]).slice();
  return '<div class="msel" id="'+id+'">'+D.typy.map(t=>
    '<button type="button" class="chip'+(MSEL[id].includes(t.id)?' sel':'')+'" onclick="mselToggle(\''+id+'\',\''+t.id+'\')">'+esc(t.nazev)+'</button>').join('')+'</div>';

function mselToggle(id,val){
  const a=MSEL[id]||[];const i=a.indexOf(val);
  if(i>=0)a.splice(i,1);else a.push(val);
  MSEL[id]=a;
  const el=document.getElementById(id);
  if(el)el.querySelectorAll('.chip').forEach((ch,ix)=>{const t=D.typy[ix];ch.classList.toggle('sel',a.includes(t.id));});
}

  const ukolyDnes=D.ukoly.filter(t=>!t.hotovo&&t.termin===dnes);
  const noveLeady=D.leady.filter(l=>!l.konvertovanoKlient);
  const aktKlienti=D.klienti.filter(k=>k.stav==='aktivni');
  const projMesic=D.projekty.filter(p=>mesicISO(p.vytvoreno)===mesicISO());
  const up=upozorneni();

  const mojeDnes=moje.filter(t=>t.termin&&t.termin<=dnes);
  const mojeTyden=moje.filter(t=>t.termin&&t.termin<=tydenDo());
  /* schůzky: jen moje nebo bez vlastníka (týmové) */
  const mojeSch=s=>!s.vlastnik||s.vlastnik===D.ja;
  const schDnes=D.schuzky.filter(s=>!s.hotovo&&s.datum===dnes&&mojeSch(s));
  const schTydenVse=D.schuzky.filter(s=>!s.hotovo&&s.datum>=dnes&&s.datum<=tydenDo());
  const schTydenMoje=schTydenVse.filter(mojeSch);
  const cekaRozhodnuti=akt.filter(p=>p.pm===D.ja&&['Kontrola','Čeká na klienta'].includes(p.stav));
  const followupy=moje.filter(t=>/follow/i.test(t.nazev));
  const fakturovanoMes=smimFinance()?D.faktury.filter(f=>mesicISO(f.vystaveno)===mesicISO()).reduce((s,f)=>s+(+f.castka||0),0):null;
  let h='';

    h+='<div style="margin-bottom:8px">';

     '<div class="sub">'+akt.length+' aktivních projektů · '+mojeDnes.length+' úkolů na dnes · '+schDnes.length+' mých schůzek dnes</div>'+
     '<div class="gr"></div></div>'+
     (fakturovanoMes!=null?'<div class="kpr"><div class="b mono">'+kc(fakturovanoMes)+'</div><div class="l">Fakturováno '+nazevMesice(mesicISO())+'</div></div>':'')+
     '</div>';

    const p=projekt(x.o.projektId);
    return '<div class="ck"><input type="checkbox" onchange="hotovoUkol(\''+x.o.id+'\')"><div class="t">'+esc(x.o.nazev)+(p?' <span class="muted">· '+esc(p.nazev)+'</span>':'')+(x.o.termin<dnes?' <span class="pill p-bad">po termínu</span>':'')+'</div></div>';
  }).join('');}
  h+='<div class="eyebrow" style="margin:14px 0 8px">Tento týden</div>'+
    '<div style="display:flex;gap:18px;flex-wrap:wrap;font-size:13px">'+

   '<div class="stat"><div class="k">Konvertováno celkem</div><div class="v">'+D.leady.filter(l=>l.konvertovanoKlient).length+'</div><div class="n">leadů → klientů</div></div></div>';
  h+='<div class="kan">';
  LFAZE.forEach(([f,nm])=>{
    const ls=otevrene.filter(l=>l.faze===f).sort((a,b)=>String(a.dalsiKrokDatum||'9').localeCompare(String(b.dalsiKrokDatum||'9')));
    h+='<div class="kan-col"><div class="kan-h"><span class="t">'+nm+'</span><span class="nbadge" style="background:var(--concrete);color:var(--ink-2)">'+ls.length+'</span>'+

       '<div class="mt">'+esc(l.kontakt||'')+(pot?' · '+esc(pot):'')+'</div>'+
       (l.dalsiKrok?'<div class="mt" style="color:'+(pozde?'var(--bad)':'var(--ink-2)')+'">→ '+esc(l.dalsiKrok)+(l.dalsiKrokDatum?' · '+dat(l.dalsiKrokDatum):'')+'</div>':'<div class="mt" style="color:var(--bad)">Chybí další krok</div>')+

  if(f!=='vse')ks=ks.filter(k=>k.stav===f);
  let h='<div class="chips" style="margin-bottom:14px">'+filtry.map(([id,nm])=>{
    const n=id==='vse'?D.klienti.length:D.klienti.filter(k=>k.stav===id).length;

  h+='<table><thead><tr><th>Klient</th><th>Kontakt</th><th>Odvětví</th><th>Správce</th><th class="num">Projekty</th><th class="num">Aktivní cena</th><th>Stav</th><th>Poslední aktivita</th></tr></thead><tbody>';
  h+=ks.sort((a,b)=>a.nazev.localeCompare(b.nazev,'cs')).map(k=>{
    const pr=D.projekty.filter(p=>p.klientId===k.id&&!p.archiv);
    const akt=pr.filter(p=>!['Dokončeno','Archiv'].includes(p.stav));
    const posl=pr.map(p=>p.posledniAktivita).sort().reverse()[0];
    const stavPill={aktivni:'<span class="pill p-ok">Aktivní</span>',neaktivni:'<span class="pill p-warn">Neaktivní</span>',ukonceny:'<span class="pill p-n">Ukončený</span>'}[k.stav]||'<span class="pill p-n">'+esc(k.stav)+'</span>';
    return '<tr class="click" onclick="jdi(\'klient\',\''+k.id+'\')"><td><b>'+esc(k.nazev)+'</b></td>'+
    '<td>'+esc(k.kontakt||'—')+'<div class="muted" style="font-size:11.5px">'+esc(k.email||'')+'</div></td>'+
    '<td>'+esc(k.odvetvi||'—')+'</td>'+
    '<td>'+(k.spravce?'<div style="display:flex;align-items:center;gap:6px">'+ownHtml(k.spravce,true)+'<span style="font-size:12.5px">'+esc((uz(k.spravce)||{}).jmeno||'')+'</span></div>':'—')+'</td>'+
    '<td class="num">'+pr.length+'</td>'+
    '<td class="num">'+kc(akt.reduce((s,p)=>s+(+p.cena||0),0))+'</td>'+
    '<td>'+stavPill+'</td>'+
    '<td class="muted" style="font-size:12.5px">'+(posl?dat(posl):'—')+'</td></tr>';
  }).join('');
  return h+'</tbody></table></div>';
}
function vKlient(){
  const k=klient(arg);if(!k)return '<div class="empty">Klient nenalezen</div>';
  /* otevření detailu = přečtení zpráv od klienta */
  let zmena=false;
  D.zpravy.filter(z=>z.klientId===k.id&&z.od==='klient'&&!z.precteno).forEach(z=>{z.precteno=true;zmena=true;});
  if(zmena)uloz();
  const pr=D.projekty.filter(p=>p.klientId===k.id&&!p.archiv);
  const sch=D.schuzky.filter(s=>s.klientId===k.id).sort((a,b)=>String(b.datum).localeCompare(a.datum));

function ulozKlienta(id){
  if(!gv('k-nazev')){toast('Vyplň název klienta');return;}
  const o=id?klient(id):{id:uid('k'),vytvoreno:dnesISO()};
  Object.assign(o,{nazev:gv('k-nazev'),ico:gv('k-ico'),kontakt:gv('k-kontakt'),email:gv('k-email'),telefon:gv('k-telefon'),
   odvetvi:gv('k-odvetvi'),obrat:gv('k-obrat'),zdroj:gv('k-zdroj'),ziskan:gv('k-ziskan'),stav:gv('k-stav'),spravce:gv('k-spravce'),pozn:gv('k-pozn')});
  if(!id)D.klienti.push(o);
  uloz();zavri();render();toast('Klient uložen');
}
function smazKlienta(id){
  const pr=D.projekty.filter(p=>p.klientId===id);
  if(pr.length){toast('Klient má '+pr.length+' projektů — nejdřív je smaž nebo přeřaď');return;}
  if(!confirm('Smazat klienta?'))return;
  D.klienti=D.klienti.filter(k=>k.id!==id);
  D.schuzky.forEach(s=>{if(s.klientId===id)s.klientId='';});
  D.zpravy=D.zpravy.filter(z=>z.klientId!==id);
  D.smlouvy=D.smlouvy.filter(s=>!(s.strana==='klient'&&s.stranaId===id));
  D.portalUcty=D.portalUcty.filter(u=>u.klientId!==id);
  uloz();zavri();jdi('klienti');toast('Smazáno');
}

function vProjekty(){
  const vsechny=viditelneProjekty();
  const filtry=['Všechny','Moje','Aktivní','Příprava','Realizace','Čeká na klienta','Kontrola','Dokončené'];
  const f=sub||'Aktivní';
  let ps=vsechny;
  if(f==='Moje')ps=vsechny.filter(p=>p.pm===D.ja||p.odpovedny===D.ja);
  else if(f==='Aktivní')ps=vsechny.filter(p=>!['Dokončeno','Archiv'].includes(p.stav));
  else if(f==='Dokončené')ps=vsechny.filter(p=>p.stav==='Dokončeno');
  else if(f!=='Všechny')ps=vsechny.filter(p=>p.stav===f);
  const typF=arg;
  if(typF)ps=ps.filter(p=>(p.sluzby||[]).includes(typF));
  let h='<div class="chips" style="margin-bottom:10px">'+filtry.map(x=>'<button class="chip'+(f===x?' on':'')+'" onclick="jdi(\'projekty\','+(typF?'\''+typF+'\'':'null')+',\''+x+'\')">'+x+'</button>').join('')+'</div>';
  h+='<div class="chips" style="margin-bottom:16px"><span class="muted" style="font-size:12px">Služba:</span>'+
   '<button class="chip'+(!typF?' on':'')+'" onclick="jdi(\'projekty\',null,\''+f+'\')">Vše</button>'+
   D.typy.map(t=>'<button class="chip'+(typF===t.id?' on':'')+'" onclick="jdi(\'projekty\',\''+t.id+'\',\''+f+'\')">'+esc(t.nazev)+'</button>').join('')+'</div>';
  /* Dokončené vždy na konec (hlavně u filtru Všechny) */
  ps=ps.slice().sort((a,b)=>{
    const da=a.stav==='Dokončeno'?1:0,db=b.stav==='Dokončeno'?1:0;
    return da-db||String(a.deadline||'9').localeCompare(String(b.deadline||'9'));
  });
  h+='<div class="pgrid">'+ps.map(pKarta).join('')+'</div>';
  if(!ps.length)h+='<div class="empty"><div class="big">Žádný projekt v tomto filtru</div>Projekt je hlavní objekt systému — založ ho tlačítkem nahoře, nebo konverzí leadu.</div>';
  return h;
}

      return '<div class="ck"><span>✔</span><div class="t">'+(v.link?'<a href="'+esc(v.link)+'" target="_blank" rel="noopener">'+esc(v.nazev)+'</a>':esc(v.nazev))+' <span class="pill '+(m[v.stav]||'p-n')+'">'+esc(v.stav||'')+'</span><div class="muted" style="font-size:11.5px">'+esc(v.typ||'')+'</div></div><span class="meta"><button class="btn btn-o btn-xs" onclick="formVystup(\''+p.id+'\',\''+v.id+'\')">Upravit</button></span></div>';}).join('')||'<div class="muted" style="font-size:13px">Co klient reálně dostane: dokumenty, web, kampaně, manuály.</div>';

function ukolRadek(x,vProjektuFlag){
  const p=projekt(x.projektId);
  const pozde=!x.hotovo&&x.termin&&x.termin<dnesISO();
  return '<div class="ck'+(x.hotovo?' done':'')+'"><input type="checkbox"'+(x.hotovo?' checked':'')+' onchange="hotovoUkol(\''+x.id+'\')">'+
   '<div class="t">'+esc(x.nazev)+(!vProjektuFlag&&p?' <span class="muted">· '+esc(p.nazev)+'</span>':'')+
   (pozde?' <span class="pill p-bad">po termínu</span>':'')+
   '<div class="muted" style="font-size:11px;display:flex;gap:8px;margin-top:1px">'+(x.termin?'<span>'+dat(x.termin)+'</span>':'')+(x.odhadH?'<span>'+h1(x.odhadH)+' h</span>':'')+'<span>'+esc((uz(x.vlastnik)||{}).jmeno||'—')+'</span>'+(x.checklist?'<span>checklist'+(x.sluzba?' · '+esc(nazevTypu(x.sluzba)):'')+'</span>':'')+'</div></div>'+
   '<span class="meta">'+pillPrio(x.priorita)+' <button class="btn btn-o btn-xs" onclick="formUkol(\''+x.id+'\')">Upravit</button></span></div>';
}

/* checklist generátor pro jednu službu */
function pridejChecklistSluzby(p,slId){
  const typ=typProjektu(slId);if(!typ)return 0;
  (typ.checklist||[]).forEach(c=>{
    D.ukoly.push({id:uid('t'),projektId:p.id,nazev:c,vlastnik:p.odpovedny,priorita:'Střední',
     termin:'',odhadH:null,hotovo:false,checklist:true,sluzba:slId,vytvoreno:dnesISO()});
  });
  return (typ.checklist||[]).length;
}
/* založení projektu — jádro automatizace, více služeb */
function zalozProjekt(o){
  const sluzby=(o.sluzby&&o.sluzby.length)?o.sluzby.slice():(o.typ?[o.typ]:['jine']);
  const p={id:uid('p'),nazev:o.nazev,klientId:o.klientId,sluzby:sluzby,typ:sluzby[0],pm:o.pm||D.ja,odpovedny:o.odpovedny||o.pm||D.ja,
   stav:o.stav||'Příprava',priorita:o.priorita||'Střední',zahajeni:o.zahajeni||dnesISO(),deadline:o.deadline||'',
   cena:o.cena!=null?o.cena:null,sazba:o.sazba!=null?o.sazba:null,rozpocetH:o.rozpocetH!=null?o.rozpocetH:null,
   fakturovano:0,stavFakturace:'Nefakturováno',vysledekCil:o.vysledekCil||'',vysledekStav:'',vysledekText:'',
   faze:1,partneri:[],vystupy:[],dokumenty:[],archiv:false,vytvoreno:dnesISO(),posledniAktivita:dnesISO(),
   historie:[{datum:dnesISO(),text:'Projekt založen ('+sluzby.map(nazevTypu).join(' + ')+')'}]};
  D.projekty.push(p);
  sluzby.forEach(sl=>pridejChecklistSluzby(p,sl));
  D.ukoly.push({id:uid('t'),projektId:p.id,nazev:'Onboarding klienta — očekávání, komunikace, přístupy',vlastnik:p.pm,priorita:'Vysoká',termin:plusDni(dnesISO(),3),odhadH:1,hotovo:false,checklist:false,vytvoreno:dnesISO()});
  const pm=uz(p.pm);
  if(pm&&pm.kapacita&&p.rozpocetH){
    const volno14=pm.kapacita*2-naplanovano(pm.id,14);
    if(p.rozpocetH>volno14)toast('Pozor: '+pm.jmeno+' má na 14 dní volných jen '+h1(Math.max(0,volno14))+' h, projekt chce '+p.rozpocetH+' h');
  }
  uloz();
  return p.id;
}
/* přidání služby do běžícího projektu */
function formPridatSluzbu(pid){
  const p=projekt(pid);if(!p)return;
  const volne=D.typy.filter(t=>!(p.sluzby||[]).includes(t.id));
  if(!volne.length){toast('Projekt už obsahuje všechny typy služeb');return;}
  const b='<p style="font-size:13.5px;margin-bottom:12px">Do projektu se přidá další služba a automaticky se vloží její checklist. Struktura projektu zůstává — jen přibude další vrstva práce.</p>'+
  '<div class="f"><label>Služba</label><select id="ps-sluzba">'+volne.map(t=>'<option value="'+t.id+'">'+esc(t.nazev)+' ('+t.checklist.length+' kroků)</option>').join('')+'</select></div>';
  modal('Přidat službu do projektu',b,'<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="pridatSluzbu(\''+pid+'\')">Přidat službu</button>');
}
function pridatSluzbu(pid){
  const p=projekt(pid);if(!p)return;
  const sl=gv('ps-sluzba');if(!sl)return;
  if((p.sluzby||[]).includes(sl)){toast('Služba už v projektu je');return;}
  p.sluzby.push(sl);p.typ=p.sluzby[0];
  const n=pridejChecklistSluzby(p,sl);
  zapisHistorii(p,'Přidána služba: '+nazevTypu(sl)+' (+'+n+' kroků checklistu)');
  uloz();zavri();render();toast('Služba '+nazevTypu(sl)+' přidána, checklist vytvořen');
}

  const f=(id?'<button class="btn btn-d btn-s" onclick="smazProjekt(\''+id+'\')">Smazat</button>':'')+
   '<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="ulozProjekt(\''+(id||'')+'\')">Uložit</button>';
  modal(id?'Upravit projekt':'Nový projekt',b,f,true);

function ulozProjekt(id){
  if(!gv('p-nazev')){toast('Vyplň název projektu');return;}
  const sl=(MSEL['p-sluzby']||[]).slice();
  if(!sl.length){toast('Vyber aspoň jednu službu');return;}
  const kl=klient(gv('p-klient'));
  if(kl&&kl.stav!=='aktivni'&&!confirm('Klient '+kl.nazev+' není aktivní ('+kl.stav+'). Opravdu k němu uložit projekt?'))return;
  if(id){
    const p=projekt(id);
    const stary=p.stav;
    const puvodni=(p.sluzby||[]).slice();
    Object.assign(p,{nazev:gv('p-nazev'),klientId:gv('p-klient'),pm:gv('p-pm'),odpovedny:gv('p-odp'),
     stav:gv('p-stav'),priorita:gv('p-prio'),deadline:gv('p-deadline'),zahajeni:gv('p-zahajeni'),
     cena:gvn('p-cena'),sazba:gvn('p-sazba'),rozpocetH:gvn('p-rozpocet'),vysledekCil:gv('p-cil')});
    p.sluzby=sl;p.typ=sl[0];
    /* nově přidané služby → checklisty */
    sl.filter(s=>!puvodni.includes(s)).forEach(s=>{
      const n=pridejChecklistSluzby(p,s);
      zapisHistorii(p,'Přidána služba: '+nazevTypu(s)+' (+'+n+' kroků checklistu)');
    });
    if(stary!==p.stav)zapisHistorii(p,'Stav: '+stary+' → '+p.stav);else p.posledniAktivita=dnesISO();
    uloz();zavri();render();toast('Projekt uložen');
  }else{
    const pid=zalozProjekt({nazev:gv('p-nazev'),klientId:gv('p-klient'),sluzby:sl,pm:gv('p-pm'),odpovedny:gv('p-odp'),
     stav:gv('p-stav'),priorita:gv('p-prio'),deadline:gv('p-deadline'),zahajeni:gv('p-zahajeni'),
     cena:gvn('p-cena'),sazba:gvn('p-sazba'),rozpocetH:gvn('p-rozpocet'),vysledekCil:gv('p-cil')});
    zavri();toast('Projekt založen, checklisty vytvořeny');jdi('projekt',pid);
  }
}
function smazProjekt(id){
  if(!confirm('Smazat projekt včetně úkolů a času?'))return;
  D.projekty=D.projekty.filter(p=>p.id!==id);
  D.ukoly=D.ukoly.filter(t=>t.projektId!==id);
  D.cas=D.cas.filter(c=>c.projektId!==id);
  D.schuzky.forEach(s=>{if(s.projektId===id)s.projektId='';});
  uloz();zavri();jdi('projekty');toast('Projekt smazán');
}
function zmenStavProjektu(id,stav){
  const p=projekt(id);if(!p)return;
  if(stav==='Dokončeno'){dokoncitProjekt(id);return;}
  zapisHistorii(p,'Stav: '+p.stav+' → '+stav);p.stav=stav;uloz();render();
}
function nastavFazi(id,f){
  const p=projekt(id);if(!p)return;
  zapisHistorii(p,'Fáze → '+String(f).padStart(2,'0')+' '+FAZE[f-1]);
  p.faze=f;uloz();render();
}
function dokoncitProjekt(id){
  const p=projekt(id);if(!p)return;
  const ot=otevreneUkoly(id);
  const b='<p style="font-size:13.5px;margin-bottom:12px">'+(ot.length?'<span class="pill p-warn">Pozor</span> Projekt má ještě <b>'+ot.length+' otevřených úkolů</b>. Dokončením se neuzavřou.':'Checklisty jsou čisté — všechny úkoly hotové.')+'</p>'+
  '<div class="f"><label>Výsledek projektu</label><select id="dk-stav"><option value="splneno">Splněno</option><option value="castecne">Částečně splněno</option><option value="nesplneno">Nesplněno</option></select></div>'+
  '<div class="f"><label>Textové vyhodnocení</label><textarea id="dk-text" placeholder="Co se povedlo, co ne, co si z toho bereme.">'+esc(p.vysledekText||'')+'</textarea></div>'+
  '<div class="f"><label>Follow-up úkol</label><select id="dk-fu"><option value="ano" selected>Vytvořit follow-up za 14 dní</option><option value="ne">Bez follow-upu</option></select><div class="hint">Cíl follow-upu: další projekt nebo dlouhodobá spolupráce.</div></div>';
  modal('Dokončit projekt',b,'<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="provedDokonceni(\''+id+'\')">Dokončit</button>');
}
function provedDokonceni(id){
  const p=projekt(id);if(!p)return;
  p.stav='Dokončeno';p.faze=Math.max(p.faze,9);
  p.vysledekStav=gv('dk-stav');p.vysledekText=gv('dk-text');
  zapisHistorii(p,'Projekt dokončen · výsledek: '+({splneno:'splněno',castecne:'částečně splněno',nesplneno:'nesplněno'}[p.vysledekStav]||''));
  if(gv('dk-fu')==='ano'){
    D.ukoly.push({id:uid('t'),projektId:p.id,nazev:'Follow-up s klientem — jak výstup funguje, co dál',vlastnik:p.pm,priorita:'Střední',termin:plusDni(dnesISO(),14),odhadH:0.5,hotovo:false,checklist:false,vytvoreno:dnesISO()});
    zapisHistorii(p,'Vytvořen follow-up úkol (+14 dní)');
    p.faze=10;
  }
  uloz();zavri();render();toast('Projekt dokončen');
}

function hotovoUkol(id){
  const t=D.ukoly.find(x=>x.id===id);if(!t)return;
  t.hotovo=!t.hotovo;t.hotovoDatum=t.hotovo?dnesISO():null;
  const p=projekt(t.projektId);if(p){p.posledniAktivita=dnesISO();

      if(ck.length&&ck.every(x=>x.hotovo))toast('Checklisty projektu jsou kompletní — zvaž posun fáze nebo dokončení');}}

}

/* partneři na projektu — s hodnotou předané práce a provizí */
function pridatPartneraNaProjekt(pid){
  const p=projekt(pid);
  const volni=D.partneri.filter(pa=>!(p.partneri||[]).some(z=>z.partnerId===pa.id));
  if(!volni.length){toast('Všichni partneři už jsou přiřazeni, nebo žádné nemáš — založ je v sekci Partneři');return;}
  const b='<div class="f"><label>Partner</label><select id="pp-id" onchange="ppKapacitaHint()">'+volni.map(pa=>{
    const obs=partnerAktivniProjekty(pa.id).length;
    return '<option value="'+pa.id+'">'+esc(pa.jmeno)+' — '+esc(pa.spec||'')+(pa.kapacitaProj?' ('+obs+'/'+pa.kapacitaProj+' projektů)':'')+'</option>';}).join('')+'</select>'+
  '<div class="hint" id="pp-hint"></div></div>'+
  '<div class="frow"><div class="f"><label>Hodnota předané práce (Kč)</label><input id="pp-hodnota" type="number" placeholder="např. 12000"><div class="hint">Z této částky se počítá naše provize podle stupně partnera.</div></div>'+
  '<div class="f"><label>Poznámka</label><input id="pp-pozn" placeholder="Co partner dělá"></div></div>';
  modal('Přiřadit partnera',b,'<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="ulozPartneraNaProjekt(\''+pid+'\')">Přiřadit</button>');
  ppKapacitaHint();
}
function ppKapacitaHint(){
  const pa=partner(gv('pp-id'));const el=document.getElementById('pp-hint');if(!el||!pa)return;
  const obs=partnerAktivniProjekty(pa.id).length;
  let t=pa.provizePct!=null?('Provize pro nás: '+pa.provizePct+' %.'):'Partner nemá nastavený stupeň provize — provize se nespočítá.';
  if(pa.kapacitaProj&&obs>=pa.kapacitaProj)t+=' ⚠ Kapacita partnera je plná ('+obs+'/'+pa.kapacitaProj+').';
  el.textContent=t;
}
function ulozPartneraNaProjekt(pid){
  const p=projekt(pid);if(!p)return;
  const pa=partner(gv('pp-id'));if(!pa)return;
  const obs=partnerAktivniProjekty(pa.id).length;
  if(pa.kapacitaProj&&obs>=pa.kapacitaProj&&!confirm(pa.jmeno+' má plnou kapacitu ('+obs+'/'+pa.kapacitaProj+' projektů). Přesto přiřadit?'))return;
  p.partneri.push({partnerId:pa.id,hodnota:gvn('pp-hodnota'),datum:dnesISO(),pozn:gv('pp-pozn')});
  zapisHistorii(p,'Přiřazen partner: '+pa.jmeno+(gvn('pp-hodnota')?' · předaná práce '+kc(gvn('pp-hodnota')):''));
  uloz();zavri();render();toast('Partner přiřazen'+(provizeZaznamu(p.partneri[p.partneri.length-1])?', provize se počítá':''));
}

/* ═══ 15. ÚKOLY — globální, s harmonikou po projektech ═══ */
let UKSBAL={};
function vUkoly(){
  const dnes=dnesISO();
  const f=sub||'moje';
  const filtry=[['moje','Moje'],['vse','Všechny'],['dnes','Dnes'],['tyden','Tento týden'],['poTerminu','Po termínu'],['hotove','Hotové']];
  let uk=D.ukoly.filter(t=>projektViditelny(t.projektId)||!t.projektId||t.vlastnik===D.ja);
  if(f==='moje')uk=uk.filter(t=>!t.hotovo&&t.vlastnik===D.ja);
  else if(f==='vse')uk=uk.filter(t=>!t.hotovo);
  else if(f==='dnes')uk=uk.filter(t=>!t.hotovo&&t.termin&&t.termin<=dnes);
  else if(f==='tyden')uk=uk.filter(t=>!t.hotovo&&t.termin&&t.termin<=tydenDo());
  else if(f==='poTerminu')uk=uk.filter(t=>!t.hotovo&&t.termin&&t.termin<dnes);
  else if(f==='hotove')uk=uk.filter(t=>t.hotovo).sort((a,b)=>String(b.hotovoDatum||'').localeCompare(String(a.hotovoDatum||''))).slice(0,40);
  if(f!=='hotove')uk=uk.slice().sort((a,b)=>String(a.termin||'9').localeCompare(String(b.termin||'9')));
  let h='<div class="chips" style="margin-bottom:12px">'+filtry.map(([id,nm])=>'<button class="chip'+(f===id?' on':'')+'" onclick="jdi(\'ukoly\',null,\''+id+'\')">'+nm+'</button>').join('')+'</div>';
  const skup={};uk.forEach(t=>{const k=t.projektId||'_bez';(skup[k]=skup[k]||[]).push(t);});
  const kliceSkupin=Object.keys(skup);
  h+='<div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px">'+
   '<button class="btn btn-o btn-xs" onclick="sbalitVse(false)">Rozbalit vše</button>'+
   '<button class="btn btn-o btn-xs" onclick="sbalitVse(true)">Sbalit vše</button></div>';
  h+='<div class="card"><div class="card-b">';
  if(!uk.length)h+='<div class="empty"><div class="big">Žádné úkoly v tomto filtru</div>Prázdný seznam úkolů znamená prostor posunout projekty nebo obchod.</div>';
  h+=kliceSkupin.map(pid=>{
    const p=projekt(pid);
    const sbaleno=!!UKSBAL[pid];
    const pozde=skup[pid].filter(t=>!t.hotovo&&t.termin&&t.termin<dnes).length;
    return '<button class="acc-h'+(sbaleno?'':' open')+'" onclick="toggleSkupinu(\''+pid+'\')">'+
      '<span class="chev">▶</span>'+
      '<span>'+(p?esc(p.nazev):'Bez projektu')+'</span>'+
      (p?'<a href="#" style="font-size:11px;color:var(--ink-3)" onclick="event.stopPropagation();jdi(\'projekt\',\''+p.id+'\',\'ukoly\');return false">otevřít projekt</a>':'')+
      (pozde?'<span class="pill p-bad">'+pozde+' po termínu</span>':'')+
      '<span class="cnt">'+skup[pid].length+' úkolů</span></button>'+
      (sbaleno?'':'<div>'+skup[pid].map(t=>ukolRadek(t,false)).join('')+'</div>');
  }).join('');
  h+='</div></div>';
  return h;
}
function toggleSkupinu(pid){UKSBAL[pid]=!UKSBAL[pid];render();}
function sbalitVse(stav){
  const skup={};
  D.ukoly.forEach(t=>{skup[t.projektId||'_bez']=1;});
  Object.keys(skup).forEach(k=>UKSBAL[k]=stav);
  render();
}

/* ═══ 16. TÝM A KAPACITA ═══ */
function vTym(){
  let h='<div class="grid g3" style="margin-bottom:16px">';
  h+=D.uzivatele.map(u=>{
    const n7=naplanovano(u.id,7);
    const volno=u.kapacita?u.kapacita-n7:null;
    const pretizen=u.kapacita&&n7>u.kapacita;
    const proj=aktivniProjekty().filter(p=>p.pm===u.id||p.odpovedny===u.id);
    const uk=D.ukoly.filter(t=>!t.hotovo&&t.vlastnik===u.id);
    const hodMes=D.cas.filter(c=>c.uzivatel===u.id&&mesicISO(c.datum)===mesicISO()).reduce((s,c)=>s+(+c.hodiny||0),0);
    return '<div class="card'+(pretizen?'" style="border-left:3px solid var(--bad)':'')+'"><div class="card-b">'+
    '<div style="display:flex;align-items:center;gap:10px">'+ownHtml(u.id)+'<div style="flex:1"><b>'+esc(u.jmeno)+'</b><div class="muted" style="font-size:11.5px">'+esc(u.pozice||ROLE[u.role]||'')+'</div></div><span class="pill p-n">'+esc(ROLE[u.role]||u.role)+'</span></div>'+
    '<div class="hr"></div>'+
    '<div style="display:flex;gap:16px;font-size:13px;flex-wrap:wrap"><span><b class="mono">'+proj.length+'</b> projektů</span><span><b class="mono">'+uk.length+'</b> úkolů</span><span><b class="mono">'+h1(hodMes)+'</b> h tento měsíc</span></div>'+
    (u.kapacita?'<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3)"><span>Naplánováno 7 dní</span><span class="mono">'+h1(n7)+' / '+u.kapacita+' h</span></div>'+
    '<div style="margin-top:4px">'+progress(n7/u.kapacita*100,pretizen?'over':'')+'</div>'+
    '<div class="muted" style="font-size:11.5px;margin-top:4px">'+(pretizen?'<span style="color:var(--bad)">Přetížení '+h1(n7-u.kapacita)+' h — deleguj nebo posuň termíny</span>':'Volná kapacita '+h1(volno)+' h')+'</div></div>':'')+
    '</div></div>';
  }).join('');
  h+='</div>';
  h+='<div class="card"><div class="card-h"><h2>Team workload</h2><span class="sub">kde je bottleneck</span></div><table><thead><tr><th>Člověk</th><th class="num">Aktivní projekty</th><th class="num">Otevřené úkoly</th><th class="num">Po termínu</th><th class="num">Naplánováno 7 d</th><th class="num">Kapacita</th><th class="num">Hodiny tento měsíc</th></tr></thead><tbody>';
  h+=D.uzivatele.map(u=>{
    const proj=aktivniProjekty().filter(p=>p.pm===u.id||p.odpovedny===u.id).length;
    const uk=D.ukoly.filter(t=>!t.hotovo&&t.vlastnik===u.id);
    const pozde=uk.filter(t=>t.termin&&t.termin<dnesISO()).length;
    const n7=naplanovano(u.id,7);
    const hodMes=D.cas.filter(c=>c.uzivatel===u.id&&mesicISO(c.datum)===mesicISO()).reduce((s,c)=>s+(+c.hodiny||0),0);
    return '<tr><td><div style="display:flex;align-items:center;gap:8px">'+ownHtml(u.id,true)+esc(u.jmeno)+'</div></td>'+
    '<td class="num">'+proj+'</td><td class="num">'+uk.length+'</td><td class="num"'+(pozde?' style="color:var(--bad);font-weight:600"':'')+'>'+pozde+'</td>'+
    '<td class="num"'+(u.kapacita&&n7>u.kapacita?' style="color:var(--bad);font-weight:600"':'')+'>'+h1(n7)+' h</td><td class="num">'+(u.kapacita||'—')+' h</td><td class="num">'+h1(hodMes)+' h</td></tr>';
  }).join('');
  h+='</tbody></table><div class="card-b muted" style="border-top:1px solid var(--line);font-size:12px">Kapacita se počítá z odhadů hodin u otevřených úkolů s termínem do 7 dnů. Úkoly bez odhadu kapacitu nezatíží — odhady vyplňuj.</div></div>';
  return h;
}

/* ═══ 17. PARTNEŘI ═══ */
function specSeznam(){
  const s=new Set();
  D.partneri.forEach(pa=>String(pa.spec||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>s.add(x)));
  return [...s].sort((a,b)=>a.localeCompare(b,'cs'));
}
function vPartneri(){
  const specF=sub||'';
  let ps=D.partneri.slice();
  if(specF)ps=ps.filter(pa=>String(pa.spec||'').split(',').map(x=>x.trim()).includes(specF));
  let h='<div class="chips" style="margin-bottom:14px"><span class="muted" style="font-size:12px">Specializace:</span>'+
   '<button class="chip'+(!specF?' on':'')+'" onclick="jdi(\'partneri\')">Vše</button>'+
   specSeznam().map(s=>'<button class="chip'+(specF===s?' on':'')+'" onclick="jdi(\'partneri\',null,\''+esc(s)+'\')">'+esc(s)+'</button>').join('')+'</div>';
  h+='<div class="card"><div class="card-h"><h2>Síť specialistů</h2><span class="sub">'+ps.length+' partnerů'+(specF?' · '+esc(specF):'')+'</span></div>';
  if(!ps.length)return h+'<div class="card-b"><div class="empty"><div class="big">Žádný partner v tomto filtru</div>Účetní, právník, grafik, developer — databáze lidí, na které se dá spolehnout.</div></div></div>';
  h+='<table><thead><tr><th>Partner</th><th>Specializace</th><th>Správce</th><th class="num">Provize</th><th class="num">Kapacita</th><th>Hodnocení</th><th>Smlouva</th><th>Stav</th></tr></thead><tbody>';
  h+=ps.map(pa=>{
    const obs=partnerAktivniProjekty(pa.id).length;
    const plna=pa.kapacitaProj&&obs>=pa.kapacitaProj;
    const sml=D.smlouvy.filter(s=>s.strana==='partner'&&s.stranaId===pa.id);
    const podepsana=sml.some(s=>s.stav==='podepsáno');
    const odeslana=sml.some(s=>s.stav==='odesláno');
    return '<tr class="click" onclick="formPartner(\''+pa.id+'\')"><td><b>'+esc(pa.jmeno)+'</b><div class="muted" style="font-size:11.5px">'+esc(pa.email||'')+'</div></td>'+
    '<td style="font-size:12.5px">'+esc(pa.spec||'—')+'</td>'+
    '<td>'+(pa.spravce?'<div style="display:flex;align-items:center;gap:6px">'+ownHtml(pa.spravce,true)+'</div>':'—')+'</td>'+
    '<td class="num">'+(pa.provizePct!=null?pa.provizePct+' %':'—')+'</td>'+
    '<td class="num"'+(plna?' style="color:var(--bad);font-weight:600"':'')+'>'+(pa.kapacitaProj?obs+' / '+pa.kapacitaProj:'—')+'</td>'+
    '<td><span class="stars">'+'★'.repeat(pa.hodnoceni||0)+'☆'.repeat(5-(pa.hodnoceni||0))+'</span></td>'+
    '<td>'+(podepsana?'<span class="pill p-ok">podepsána</span>':(odeslana?'<span class="pill p-warn">odeslána</span>':'<span class="pill p-n">chybí</span>'))+'</td>'+
    '<td>'+(pa.stav==='aktivní'?'<span class="pill p-ok">Aktivní</span>':'<span class="pill p-n">'+esc(pa.stav||'—')+'</span>')+'</td></tr>';
  }).join('');
  return h+'</tbody></table><div class="card-b muted" style="border-top:1px solid var(--line);font-size:12px">Kapacita = kolik projektů partner zvládne souběžně. Provize = náš podíl z práce, kterou mu předáme.</div></div>';
}
function formPartner(id){
  const pa=id?partner(id):{stav:'aktivní',hodnoceni:0,dokumenty:[],spravce:D.ja};
  const proj=id?D.projekty.filter(p=>(p.partneri||[]).some(z=>z.partnerId===id)):[];
  const sml=id?D.smlouvy.filter(s=>s.strana==='partner'&&s.stranaId===id):[];
  const b='<div class="frow"><div class="f"><label>Jméno / firma</label><input id="pa-jmeno" value="'+esc(pa.jmeno||'')+'"></div>'+
  '<div class="f"><label>Specializace (odděl čárkou)</label><input id="pa-spec" value="'+esc(pa.spec||'')+'" placeholder="Účetnictví, Daně"></div></div>'+
  '<div class="frow"><div class="f"><label>E-mail</label><input id="pa-email" value="'+esc(pa.email||'')+'"></div>'+
  '<div class="f"><label>Telefon</label><input id="pa-telefon" value="'+esc(pa.telefon||'')+'"></div></div>'+
  '<div class="frow3"><div class="f"><label>Stupeň provize pro nás</label><select id="pa-provize"><option value="">— nenastaveno —</option>'+PROVIZE_STUPNE.map(n=>'<option value="'+n+'"'+(pa.provizePct===n?' selected':'')+'>'+n+' %</option>').join('')+'</select><div class="hint">Z hodnoty předané práce.</div></div>'+
  '<div class="f"><label>Kapacita (projektů souběžně)</label><input id="pa-kapacita" type="number" min="0" value="'+(pa.kapacitaProj??'')+'"></div>'+
  '<div class="f"><label>Správce partnera</label>'+selUz('pa-spravce',pa.spravce,true)+'</div></div>'+
  '<div class="frow"><div class="f"><label>Hodnocení spolupráce</label><select id="pa-hodnoceni">'+[0,1,2,3,4,5].map(n=>'<option value="'+n+'"'+(pa.hodnoceni===n?' selected':'')+'>'+(n?'★'.repeat(n):'—')+'</option>').join('')+'</select></div>'+
  '<div class="f"><label>Stav spolupráce</label>'+selOpt('pa-stav',['aktivní','pozastavená','ukončená'],pa.stav)+'</div></div>'+
  '<div class="f"><label>Poznámky</label><textarea id="pa-pozn">'+esc(pa.pozn||'')+'</textarea></div>'+
  (id?'<div class="hr"></div><div class="eyebrow" style="margin-bottom:6px">Smlouvy s partnerem ('+sml.length+')</div>'+
   sml.map(s=>{const m={'podepsáno':'p-ok','odesláno':'p-warn','koncept':'p-n','ukončeno':'p-n'};
    return '<div class="ck"><span>✎</span><div class="t">'+esc(s.typ)+' <span class="pill '+(m[s.stav]||'p-n')+'">'+esc(s.stav)+'</span></div><span class="meta"><button class="btn btn-o btn-xs" onclick="zavri();formSmlouva(\''+s.id+'\')">Detail</button></span></div>';}).join('')+
   '<button class="btn btn-o btn-s" style="margin-top:6px" onclick="zavri();formSmlouva(null,\'partner\',\''+id+'\')">+ Nová smlouva s partnerem</button>':'')+
  (id?'<div class="hr"></div><div class="eyebrow" style="margin-bottom:6px">Dokumenty partnera ('+(pa.dokumenty||[]).length+')</div>'+
   (pa.dokumenty||[]).map(d=>'<div class="ck"><span>▭</span><div class="t">'+(d.link?'<a href="'+esc(d.link)+'" target="_blank" rel="noopener">'+esc(d.nazev)+'</a>':esc(d.nazev))+'<div class="muted" style="font-size:11.5px">'+esc(d.typ||'')+' · '+dat(d.datum)+'</div></div><span class="meta"><button class="btn btn-d btn-xs" onclick="smazDokPartnera(\''+id+'\',\''+d.id+'\')">×</button></span></div>').join('')+
   '<div class="frow3" style="margin-top:8px"><div class="f"><label>Nový dokument</label><input id="pad-nazev" placeholder="Rámcová smlouva"></div>'+
   '<div class="f"><label>Typ</label>'+selOpt('pad-typ',['Smlouva','NDA','Ceník','Podklad','Jiné'])+'</div>'+
   '<div class="f"><label>Odkaz (Drive)</label><input id="pad-link" placeholder="https://…"></div></div>'+
   '<button class="btn btn-o btn-s" onclick="pridejDokPartnera(\''+id+'\')">Přidat dokument</button>':'')+
  (id&&proj.length?'<div class="hr"></div><div class="eyebrow" style="margin-bottom:6px">Projekty partnera ('+proj.length+')</div>'+proj.map(p=>{const k=klient(p.klientId);
    const z=(p.partneri||[]).find(x=>x.partnerId===id)||{};
    const prov=provizeZaznamu({...z,partnerId:id});
    return '<div class="ck"><span>▤</span><div class="t"><a href="#" onclick="zavri();jdi(\'projekt\',\''+p.id+'\',\'partneri\');return false">'+esc(p.nazev)+'</a> <span class="muted">· '+esc(k?k.nazev:'')+'</span><div class="muted" style="font-size:11px">předáno '+kc(z.hodnota)+(prov?' · provize '+kc(prov):'')+'</div></div><span class="meta">'+esc(p.stav)+'</span></div>';}).join(''):'');
  const f=(id?'<button class="btn btn-d btn-s" onclick="smazPartnera(\''+id+'\')">Smazat</button>':'')+
   '<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="ulozPartnera(\''+(id||'')+'\')">Uložit</button>';
  modal(id?'Partner — detail':'Nový partner',b,f,true);
}
function pridejDokPartnera(id){
  const pa=partner(id);if(!pa)return;
  if(!gv('pad-nazev')){toast('Vyplň název dokumentu');return;}
  pa.dokumenty.push({id:uid('pd'),nazev:gv('pad-nazev'),typ:gv('pad-typ'),link:gv('pad-link'),datum:dnesISO()});
  uloz();formPartner(id);toast('Dokument přidán');
}
function smazDokPartnera(id,did){const pa=partner(id);if(!pa)return;pa.dokumenty=(pa.dokumenty||[]).filter(d=>d.id!==did);uloz();formPartner(id);}
function ulozPartnera(id){
  if(!gv('pa-jmeno')){toast('Vyplň jméno');return;}
  const o=id?partner(id):{id:uid('pa'),dokumenty:[]};
  Object.assign(o,{jmeno:gv('pa-jmeno'),spec:gv('pa-spec'),email:gv('pa-email'),telefon:gv('pa-telefon'),
   provizePct:gv('pa-provize')===''?null:+gv('pa-provize'),kapacitaProj:gvn('pa-kapacita'),spravce:gv('pa-spravce'),
   hodnoceni:+gv('pa-hodnoceni')||0,stav:gv('pa-stav'),pozn:gv('pa-pozn')});
  if(!id)D.partneri.push(o);
  uloz();zavri();render();toast('Partner uložen');
}
function smazPartnera(id){
  if(!confirm('Smazat partnera?'))return;
  D.partneri=D.partneri.filter(p=>p.id!==id);
  D.projekty.forEach(p=>{p.partneri=(p.partneri||[]).filter(z=>z.partnerId!==id);});
  D.smlouvy=D.smlouvy.filter(s=>!(s.strana==='partner'&&s.stranaId===id));
  uloz();zavri();render();toast('Smazáno');
}

/* ═══ 18. SCHŮZKY ═══ */
function vSchuzky(){
  const dnes=dnesISO();
  const f=sub||'vse';
  const mojeF=s=>f==='moje'?(!s.vlastnik||s.vlastnik===D.ja):true;
  const bud=D.schuzky.filter(s=>!s.hotovo&&s.datum>=dnes&&mojeF(s)).sort((a,b)=>(a.datum+a.cas).localeCompare(b.datum+b.cas));
  const stare=D.schuzky.filter(s=>(s.hotovo||s.datum<dnes)&&mojeF(s)).sort((a,b)=>(b.datum+b.cas).localeCompare(a.datum+a.cas));
  const dny={};bud.forEach(s=>{(dny[s.datum]=dny[s.datum]||[]).push(s);});
  let h='<div class="chips" style="margin-bottom:14px">'+
   '<button class="chip'+(f==='vse'?' on':'')+'" onclick="jdi(\'schuzky\',null,\'vse\')">Všechny</button>'+
   '<button class="chip'+(f==='moje'?' on':'')+'" onclick="jdi(\'schuzky\',null,\'moje\')">Moje</button></div>';
  h+='<div class="card"><div class="card-h"><h2>Nadcházející schůzky</h2><span class="sub">'+bud.length+'</span></div><div class="card-b">';
  if(!bud.length)h+='<div class="muted" style="font-size:13px">Žádná naplánovaná schůzka.</div>';
  h+=Object.keys(dny).map(d=>{
    const dnesLbl=d===dnes?' · dnes':(d===plusDni(dnes,1)?' · zítra':'');
    return '<div class="eyebrow" style="margin:12px 0 4px">'+dat(d)+dnesLbl+'</div>'+dny[d].map(s=>schRadek(s)).join('');
  }).join('');
  h+='</div></div>';
  if(stare.length){h+='<div class="card" style="margin-top:14px"><div class="card-h"><h2>Proběhlé</h2><span class="sub">posledních 10</span></div><div class="card-b">'+stare.slice(0,10).map(s=>schRadek(s)).join('')+'</div></div>';}
  return h;
}
function schRadek(s){
  const k=klient(s.klientId),p=projekt(s.projektId);
  return '<div class="ck'+(s.hotovo?' done':'')+'"><input type="checkbox"'+(s.hotovo?' checked':'')+' onchange="hotovoSchuzka(\''+s.id+'\')" title="Proběhla">'+
   '<div class="t"><b>'+esc(s.cas||'')+'</b> '+esc(s.nazev)+' <span class="pill p-n" style="margin-left:4px">'+esc(s.typ||'')+'</span>'+
   '<div class="muted" style="font-size:11.5px">'+(k?esc(k.nazev):'')+(p?' · '+esc(p.nazev):'')+(s.ucastnici?' · '+esc(s.ucastnici):'')+'</div>'+
   (s.pozn?'<div style="font-size:12px;margin-top:2px;white-space:pre-wrap">'+esc(s.pozn)+'</div>':'')+'</div>'+
   '<span class="meta">'+(s.vlastnik?ownHtml(s.vlastnik,true):'<span class="pill p-n" title="Bez vlastníka — zobrazí se všem">tým</span>')+'<button class="btn btn-o btn-xs" onclick="formSchuzka(\''+s.id+'\')">Upravit</button></span></div>';
}
function hotovoSchuzka(id){const s=D.schuzky.find(x=>x.id===id);if(!s)return;s.hotovo=!s.hotovo;uloz();render();}
function formSchuzka(id,klientPredvolba,projektPredvolba){
  const s=id?D.schuzky.find(x=>x.id===id):{datum:dnesISO(),cas:'10:00',typ:'Klientská',klientId:klientPredvolba||'',projektId:projektPredvolba||'',vlastnik:D.ja};
  const b='<div class="f"><label>Název schůzky</label><input id="s-nazev" value="'+esc(s.nazev||'')+'"></div>'+
  '<div class="frow3"><div class="f"><label>Datum</label><input id="s-datum" type="date" value="'+(s.datum||'')+'"></div>'+
  '<div class="f"><label>Čas</label><input id="s-cas" type="time" value="'+esc(s.cas||'')+'"></div>'+
  '<div class="f"><label>Typ</label>'+selOpt('s-typ',['Klientská','Obchodní','Interní'],s.typ)+'</div></div>'+
  '<div class="frow"><div class="f"><label>Vlastník schůzky (komu se počítá)</label>'+selUz('s-vlastnik',s.vlastnik)+'<div class="hint">Bez vlastníka = týmová, uvidí ji všichni na dashboardu.</div></div>'+
  '<div class="f"><label>Účastníci</label><input id="s-ucastnici" value="'+esc(s.ucastnici||'')+'"></div></div>'+
  '<div class="frow"><div class="f"><label>Klient</label><select id="s-klient"><option value="">—</option>'+D.klienti.map(k=>'<option value="'+k.id+'"'+(s.klientId===k.id?' selected':'')+'>'+esc(k.nazev)+'</option>').join('')+'</select></div>'+
  '<div class="f"><label>Projekt</label><select id="s-projekt"><option value="">—</option>'+D.projekty.filter(p=>!p.archiv).map(p=>'<option value="'+p.id+'"'+(s.projektId===p.id?' selected':'')+'>'+esc(p.nazev)+'</option>').join('')+'</select></div></div>'+
  '<div class="f"><label>Poznámka / zápis</label><textarea id="s-pozn">'+esc(s.pozn||'')+'</textarea></div>';

}
function ulozSchuzku(id){
  if(!gv('s-nazev')){toast('Vyplň název');return;}
  const o=id?D.schuzky.find(x=>x.id===id):{id:uid('s'),hotovo:false};
  Object.assign(o,{nazev:gv('s-nazev'),datum:gv('s-datum'),cas:gv('s-cas'),typ:gv('s-typ'),vlastnik:gv('s-vlastnik'),klientId:gv('s-klient'),projektId:gv('s-projekt'),ucastnici:gv('s-ucastnici'),pozn:gv('s-pozn')});
  if(!id)D.schuzky.push(o);

function smazSchuzku(id){if(!confirm('Smazat schůzku?'))return;D.schuzky=D.schuzky.filter(s=>s.id!==id);uloz();zavri();render();}

/* ═══ 19. FINANCE ═══ */
function vFinance(){
  if(!smimFinance())return '<div class="empty">K financím má přístup jen administrátor.</div>';
  const dnes=dnesISO();
  D.faktury.forEach(f=>{if(f.stav==='vystavena'&&f.splatnost&&f.splatnost<dnes)f.stav='po splatnosti';});
  const mes=arg||mesicISO();
  const mesice=[...new Set([mesicISO(),...D.faktury.map(f=>mesicISO(f.vystaveno))])].sort().reverse();
  const fMes=D.faktury.filter(f=>mesicISO(f.vystaveno)===mes);
  const akt=aktivniProjekty();
  let h='<div class="chips" style="margin-bottom:16px">'+mesice.map(m=>'<button class="chip'+(mes===m?' on':'')+'" onclick="jdi(\'finance\',\''+m+'\')">'+nazevMesice(m)+'</button>').join('')+'</div>';
  h+='<div class="grid g4" style="margin-bottom:16px">'+
  '<div class="stat acc"><div class="k">Vyfakturováno '+nazevMesice(mes).split(' ')[0]+'</div><div class="v mono" style="font-size:21px">'+kc(fMes.reduce((s,f)=>s+(+f.castka||0),0))+'</div><div class="n">'+fMes.length+' faktur</div></div>'+
  '<div class="stat"><div class="k">Zaplaceno</div><div class="v mono" style="font-size:21px">'+kc(fMes.filter(f=>f.stav==='zaplacena').reduce((s,f)=>s+(+f.castka||0),0))+'</div><div class="n">z fakturace měsíce</div></div>'+
  '<div class="stat'+(D.faktury.some(f=>f.stav==='po splatnosti')?' bad':'')+'"><div class="k">Po splatnosti</div><div class="v mono" style="font-size:21px">'+kc(D.faktury.filter(f=>f.stav==='po splatnosti').reduce((s,f)=>s+(+f.castka||0),0))+'</div><div class="n">'+D.faktury.filter(f=>f.stav==='po splatnosti').length+' faktur celkem</div></div>'+
  '<div class="stat"><div class="k">Hodnota aktivních projektů</div><div class="v mono" style="font-size:21px">'+kc(akt.reduce((s,p)=>s+(+p.cena||0),0))+'</div><div class="n">'+akt.length+' projektů</div></div></div>';
  h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Faktury</h2><span class="sub">'+nazevMesice(mes)+'</span></div>';
  if(!fMes.length)h+='<div class="card-b"><div class="muted" style="font-size:13px">V tomto měsíci žádná faktura.</div></div>';
  else{h+='<table><thead><tr><th>Číslo</th><th>Projekt / klient</th><th class="num">Částka</th><th>Vystaveno</th><th>Splatnost</th><th>Stav</th><th></th></tr></thead><tbody>';
  h+=fMes.map(f=>{const p=projekt(f.projektId);const k=p?klient(p.klientId):null;
    const m={'zaplacena':'p-ok','vystavena':'p-info','po splatnosti':'p-bad'};
    return '<tr><td class="mono">'+esc(f.cislo||'—')+'</td><td>'+(p?esc(p.nazev):'—')+'<div class="muted" style="font-size:11.5px">'+(k?esc(k.nazev):'')+'</div></td>'+
    '<td class="num">'+kc(f.castka)+'</td><td>'+dat(f.vystaveno)+'</td><td>'+dat(f.splatnost)+'</td>'+
    '<td><span class="pill '+(m[f.stav]||'p-n')+'">'+esc(f.stav)+'</span></td>'+
    '<td class="right"><button class="btn btn-o btn-xs" onclick="formFaktura(\''+f.id+'\')">Upravit</button></td></tr>';}).join('');
  h+='</tbody></table>';}
  h+='</div>';
  /* provize od partnerů */
  const provizeData=D.partneri.map(pa=>{
    let hodnota=0,provize=0;
    D.projekty.forEach(p=>(p.partneri||[]).forEach(z=>{if(z.partnerId===pa.id){hodnota+=(+z.hodnota||0);const pr=provizeZaznamu(z);if(pr)provize+=pr;}}));
    return {pa,hodnota,provize};
  }).filter(x=>x.hodnota>0);
  const provizeCelkem=provizeData.reduce((s,x)=>s+x.provize,0);
  h+='<div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Provize od partnerů</h2><span class="sub">z předané práce · celkem '+kc(provizeCelkem)+'</span></div>';
  if(!provizeData.length)h+='<div class="card-b"><div class="muted" style="font-size:13px">Zatím žádná předaná práce. Hodnotu zadáváš při přiřazení partnera k projektu.</div></div>';

  h+=provizeData.map(x=>'<tr><td><b>'+esc(x.pa.jmeno)+'</b><div class="muted" style="font-size:11.5px">'+esc(x.pa.spec||'')+'</div></td>'+

  h+='<tr><td><b>Celkem</b></td><td></td><td class="num"><b>'+kc(provizeData.reduce((s,x)=>s+x.hodnota,0))+'</b></td><td class="num"><b>'+kc(provizeCelkem)+'</b></td></tr>';
  h+='</tbody></table><div class="card-b muted" style="border-top:1px solid var(--line);font-size:12px">Partner bez nastaveného stupně provize se nepočítá — nastav ho v kartě partnera. Vyúčtování provizí řeš dle partnerské smlouvy.</div>';}
  h+='</div>';
  h+='<div class="card"><div class="card-h"><h2>Fakturační stav projektů</h2><span class="sub">cena vs. fakturováno</span></div><table><thead><tr><th>Projekt</th><th>Klient</th><th class="num">Cena</th><th class="num">Fakturováno</th><th class="num">Zbývá</th><th>Stav fakturace</th></tr></thead><tbody>';
  h+=D.projekty.filter(p=>!p.archiv&&(p.cena||p.fakturovano)).map(p=>{const k=klient(p.klientId);
    const zb=(+p.cena||0)-(+p.fakturovano||0);
    return '<tr class="click" onclick="jdi(\'projekt\',\''+p.id+'\')"><td><b>'+esc(p.nazev)+'</b></td><td>'+(k?esc(k.nazev):'—')+'</td>'+
    '<td class="num">'+kc(p.cena)+'</td><td class="num">'+kc(p.fakturovano)+'</td>'+
    '<td class="num"'+(zb>0?' style="color:var(--warn);font-weight:600"':'')+'>'+kc(zb)+'</td><td style="font-size:12.5px">'+esc(p.stavFakturace||'—')+'</td></tr>';}).join('');
  h+='</tbody></table></div>';
  return h;
}

function ulozFakturu(id){
  if(!gvn('fa-castka')){toast('Vyplň částku');return;}
  const o=id?D.faktury.find(x=>x.id===id):{id:uid('f')};
  Object.assign(o,{cislo:gv('fa-cislo'),projektId:gv('fa-projekt'),castka:gvn('fa-castka'),vystaveno:gv('fa-vystaveno'),splatnost:gv('fa-splatnost'),stav:gv('fa-stav')});
  if(!id)D.faktury.push(o);
  const p=projekt(o.projektId);
  if(p){p.fakturovano=D.faktury.filter(f=>f.projektId===p.id).reduce((s,f)=>s+(+f.castka||0),0);
    const vse=D.faktury.filter(f=>f.projektId===p.id);
    p.stavFakturace=vse.every(f=>f.stav==='zaplacena')&&p.fakturovano>=(+p.cena||0)&&p.cena?'Zaplaceno':(p.fakturovano>0?'Částečně fakturováno':'Nefakturováno');}
  uloz();zavri();render();toast('Faktura uložena');
}
