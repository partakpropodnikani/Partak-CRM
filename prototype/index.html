/* ═══ 21. REPORTING ═══ */
function vReporting(){
  const t=sub||'denni';
  const tabs=[['denni','Denní'],['tydenni','Týdenní'],['mesicni','Měsíční']];
  let h='<div class="tabs">'+tabs.map(([id,nm])=>'<button class="tab'+(t===id?' on':'')+'" onclick="jdi(\'reporting\',null,\''+id+'\')">'+nm+'</button>').join('')+'</div>';
  const dnes=dnesISO();
  if(t==='denni'){
    const ukolyDnes=D.ukoly.filter(x=>!x.hotovo&&x.termin&&x.termin<=dnes);
    const schDnes=D.schuzky.filter(s=>!s.hotovo&&s.datum===dnes);
    const cekajici=aktivniProjekty().filter(p=>p.stav==='Čeká na klienta');
    h+='<div class="card"><div class="card-h"><h2>Co musím dnes udělat</h2><span class="sub">'+dat(dnes)+'</span></div><div class="card-b">';
    h+='<div class="eyebrow" style="margin-bottom:6px">Úkoly s termínem dnes a dříve ('+ukolyDnes.length+')</div>';
    h+=ukolyDnes.map(x=>ukolRadek(x,false)).join('')||'<div class="muted" style="font-size:13px">Žádné.</div>';
    h+='<div class="eyebrow" style="margin:14px 0 6px">Dnešní schůzky ('+schDnes.length+')</div>';
    h+=schDnes.map(s=>schRadek(s)).join('')||'<div class="muted" style="font-size:13px">Žádné.</div>';
    h+='<div class="eyebrow" style="margin:14px 0 6px">Projekty čekající na klienta ('+cekajici.length+')</div>';
    h+=cekajici.map(p=>'<div class="ck"><span>⏸</span><div class="t"><a href="#" onclick="jdi(\'projekt\',\''+p.id+'\');return false">'+esc(p.nazev)+'</a><div class="muted" style="font-size:11.5px">'+pred(p.posledniAktivita)+' dní bez pohybu — urgovat po 5 dnech</div></div></div>').join('')||'<div class="muted" style="font-size:13px">Žádné.</div>';
    h+='</div></div>';
  }
  else if(t==='tydenni'){
    const od=tydenOd(),doT=tydenDo();
    const vRozmezi=(d)=>d&&d>=od&&d<=doT;
    const noveLeady=D.leady.filter(l=>vRozmezi(l.vytvoreno||l.datum));
    const noviKlienti=D.klienti.filter(k=>vRozmezi(k.vytvoreno||k.ziskan));
    const noveProj=D.projekty.filter(p=>vRozmezi(p.vytvoreno));
    const dokonceneProj=D.projekty.filter(p=>p.stav==='Dokončeno'&&(p.historie||[]).some(z=>vRozmezi(z.datum)&&/dokončen/i.test(z.text)));
    const hotoveUkoly=D.ukoly.filter(x=>x.hotovo&&vRozmezi(x.hotovoDatum));
    const zpozdene=D.ukoly.filter(x=>!x.hotovo&&x.termin&&x.termin<dnes);
    h+='<div class="grid g3" style="margin-bottom:16px">'+
     '<div class="stat"><div class="k">Nové leady</div><div class="v">'+noveLeady.length+'</div><div class="n">tento týden</div></div>'+
     '<div class="stat"><div class="k">Noví klienti</div><div class="v">'+noviKlienti.length+'</div><div class="n">tento týden</div></div>'+
     '<div class="stat"><div class="k">Nové projekty</div><div class="v">'+noveProj.length+'</div><div class="n">tento týden</div></div>'+
     '<div class="stat"><div class="k">Dokončené projekty</div><div class="v">'+dokonceneProj.length+'</div><div class="n">tento týden</div></div>'+
     '<div class="stat"><div class="k">Hotové úkoly</div><div class="v">'+hotoveUkoly.length+'</div><div class="n">tento týden</div></div>'+
     '<div class="stat'+(zpozdene.length?' bad':'')+'"><div class="k">Zpožděné úkoly</div><div class="v">'+zpozdene.length+'</div><div class="n">celkem otevřených po termínu</div></div></div>';
    h+='<div class="card"><div class="card-h"><h2>Kapacita týmu tento týden</h2></div><table><thead><tr><th>Člověk</th><th class="num">Naplánováno</th><th class="num">Kapacita</th><th class="num">Volno</th></tr></thead><tbody>';
    h+=D.uzivatele.map(u=>{const n=naplanovano(u.id,7);const vol=u.kapacita?u.kapacita-n:null;
     return '<tr><td>'+esc(u.jmeno)+'</td><td class="num">'+h1(n)+' h</td><td class="num">'+(u.kapacita||'—')+' h</td><td class="num"'+(vol!=null&&vol<0?' style="color:var(--bad);font-weight:600"':'')+'>'+(vol!=null?h1(vol)+' h':'—')+'</td></tr>';}).join('');
    h+='</tbody></table></div>';
  }
  else{
    const mes=arg||mesicISO();
    const mesice=[...new Set([mesicISO(),...D.projekty.map(p=>mesicISO(p.vytvoreno)),...D.faktury.map(f=>mesicISO(f.vystaveno))])].sort().reverse().slice(0,12);
    h+='<div class="chips" style="margin-bottom:16px">'+mesice.map(m=>'<button class="chip'+(mes===m?' on':'')+'" onclick="jdi(\'reporting\',\''+m+'\',\'mesicni\')">'+nazevMesice(m)+'</button>').join('')+'</div>';
    const noveProj=D.projekty.filter(p=>mesicISO(p.vytvoreno)===mes);
    const dokoncene=D.projekty.filter(p=>p.stav==='Dokončeno'&&(p.historie||[]).some(z=>mesicISO(z.datum)===mes&&/dokončen/i.test(z.text)));
    const fakt=smimFinance()?D.faktury.filter(f=>mesicISO(f.vystaveno)===mes).reduce((s,f)=>s+(+f.castka||0),0):null;
    const hodiny=D.cas.filter(c=>mesicISO(c.datum)===mes).reduce((s,c)=>s+(+c.hodiny||0),0);
    const up=upozorneni();
    h+='<div class="grid g4" style="margin-bottom:16px">'+
     '<div class="stat"><div class="k">Aktivní klienti</div><div class="v">'+D.klienti.filter(k=>k.stav==='aktivni').length+'</div></div>'+
     '<div class="stat"><div class="k">Nové projekty</div><div class="v">'+noveProj.length+'</div></div>'+
     '<div class="stat"><div class="k">Dokončené projekty</div><div class="v">'+dokoncene.length+'</div></div>'+
     (fakt!=null?'<div class="stat acc"><div class="k">Fakturováno</div><div class="v mono" style="font-size:20px">'+kc(fakt)+'</div></div>':'')+
     '<div class="stat"><div class="k">Odpracováno</div><div class="v">'+h1(hodiny)+' h</div></div>'+
     '<div class="stat"><div class="k">Aktivních projektů</div><div class="v">'+aktivniProjekty().length+'</div></div></div>';
    h+='<div class="grid g2"><div class="card"><div class="card-h"><h2>Vytížení týmu — '+nazevMesice(mes)+'</h2></div><table><thead><tr><th>Člověk</th><th class="num">Hodiny</th></tr></thead><tbody>';
    h+=D.uzivatele.map(u=>{const hod=D.cas.filter(c=>c.uzivatel===u.id&&mesicISO(c.datum)===mes).reduce((s,c)=>s+(+c.hodiny||0),0);
     return '<tr><td>'+esc(u.jmeno)+'</td><td class="num">'+h1(hod)+' h</td></tr>';}).join('');
    h+='</tbody></table></div>';
    h+='<div class="card"><div class="card-h"><h2>Hlavní problémy a priority</h2></div><div class="card-b">'+
     '<div class="eyebrow" style="margin-bottom:6px">Problémy (z upozornění)</div>'+
     (up.slice(0,5).map(a=>'<div style="font-size:13px;padding:3px 0">· '+esc(a.t)+': '+esc(a.x)+'</div>').join('')||'<div class="muted" style="font-size:13px">Žádné.</div>')+
     '<div class="eyebrow" style="margin:12px 0 6px">Priority dalšího období</div>'+
     (aktivniProjekty().filter(p=>['Vysoká','Kritická'].includes(p.priorita)).slice(0,5).map(p=>'<div style="font-size:13px;padding:3px 0">· '+esc(p.nazev)+' ('+esc(p.priorita.toLowerCase())+', deadline '+dat(p.deadline)+')</div>').join('')||'<div class="muted" style="font-size:13px">Žádné projekty s vysokou prioritou.</div>')+
    '</div></div></div>';
  }
  return h;

function ulozTyp(id){
  if(!gv('ty-nazev')){toast('Vyplň název');return;}
  const ck=gv('ty-checklist').split('\n').map(x=>x.trim()).filter(Boolean);
  if(id){const ty=typProjektu(id);Object.assign(ty,{nazev:gv('ty-nazev'),checklist:ck});}
  else{
    const kod=(gv('ty-id')||gv('ty-nazev')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').slice(0,12)||uid('ty');
    if(typProjektu(kod)){toast('Kód už existuje');return;}
    D.typy.push({id:kod,nazev:gv('ty-nazev'),checklist:ck});

  uloz();zavri();render();toast('Typ uložen');

function exportData(){
  const blob=new Blob([JSON.stringify(D,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='partak-crm-zaloha-'+dnesISO()+'.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('Záloha stažena');
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const nova=JSON.parse(r.result);
      if(!nova||!Array.isArray(nova.projekty))throw new Error('Neplatný formát');
      zalohujStara(JSON.stringify(D));
      D=nova;D.__reset=RESET_TOKEN;migruj();uloz();render();toast('Data importována (stará verze je v záloze)');
    }catch(e){toast('Import selhal: '+e.message);}
  };
  r.readAsText(f);
}

function generovatSmlouvu(id){
  const s=D.smlouvy.find(x=>x.id===id);if(!s)return;
  const e=smlEntita(s);
  const vzory=D.kb.sablony.filter(x=>x.kat==='Smlouva');
  let vzor=vzory.find(x=>x.nazev===s.typ)||vzory.find(x=>s.typ.startsWith(x.nazev.slice(0,8)))||null;
  let text;
  if(vzor){
    const pa=s.strana==='partner'?e:null;
    text=vzor.obsah
      .replaceAll('{{STRANA}}',e?(e.nazev||e.jmeno):'………………')
      .replaceAll('{{ICO}}',(e&&e.ico)?e.ico:'………………')
      .replaceAll('{{DATUM}}',dat(dnesISO()))
      .replaceAll('{{PROVIZE}}',pa&&pa.provizePct!=null?String(pa.provizePct):'……')
      .replaceAll('{{PARTAK}}','doplň IČO a sídlo');
  }else{
    text='Pro typ „'+s.typ+'" není v Knowledge Base šablona s kategorií Smlouva.\n\nPřidej ji v KB → Šablony a smlouvy, nebo text napiš rovnou sem.';
  }
  const b='<div class="portal-note" style="margin-bottom:10px">Pracovní vzor — před ostrým použitím nech zkontrolovat právníkem. Text můžeš před tiskem upravit.</div>'+
   '<div class="f"><textarea id="sm-text" style="min-height:340px;font-family:Georgia,serif;font-size:13px;line-height:1.6">'+esc(text)+'</textarea></div>';
  modal('Text smlouvy — '+esc(s.typ),b,
   '<button class="btn btn-o" onclick="zavri()">Zavřít</button><button class="btn btn-g" onclick="tiskSmlouvy(\''+id+'\')">Vytisknout / uložit PDF</button>',true);
}
function tiskSmlouvy(id){
  const s=D.smlouvy.find(x=>x.id===id);
  const text=gv('sm-text');
  const pd=document.getElementById('printdoc');
  pd.innerHTML='<h1>'+esc(s?s.typ:'Smlouva')+'</h1>'+esc(text);
  window.print();
}

/* ═══ 24. PORTÁL — účty ═══ */
function genKod(){return 'PRT-'+String(Math.floor(1000+Math.random()*9000));}
function formPortalUcet(id,klientPrefill){
  const u=id?D.portalUcty.find(x=>x.id===id):null;
  const k=u?klient(u.klientId):klient(klientPrefill);
  const volniKlienti=D.klienti.filter(kl=>!D.portalUcty.some(x=>x.klientId===kl.id)||(u&&u.klientId===kl.id));
  if(!u&&!volniKlienti.length){toast('Každý klient už má účet, nebo nemáš klienty');return;}
  const zona=u?u.zona:{cena:true,dokumenty:true,zpravy:true,navody:true};
  const b=(u?'<div class="f"><label>Klient</label><input value="'+esc(k?k.nazev:'')+'" disabled></div>':
   '<div class="f"><label>Klient</label><select id="pu-klient">'+volniKlienti.map(kl=>'<option value="'+kl.id+'"'+(klientPrefill===kl.id?' selected':'')+'>'+esc(kl.nazev)+'</option>').join('')+'</select></div>')+
  '<div class="frow"><div class="f"><label>Přihlašovací e-mail</label><input id="pu-email" value="'+esc(u?u.email:(k&&k.email)||'')+'"></div>'+
  '<div class="f"><label>Přístupový kód</label><div style="display:flex;gap:6px"><input id="pu-kod" value="'+esc(u?u.kod:genKod())+'" style="flex:1"><button class="btn btn-o btn-s" type="button" onclick="document.getElementById(\'pu-kod\').value=genKod()">Nový</button></div><div class="hint">V ostré verzi ho klient dostane e-mailem.</div></div></div>'+
  '<div class="f"><label>Stav účtu</label><select id="pu-stav">'+['čeká na ověření','aktivní','zablokován'].map(st=>'<option'+(u&&u.stav===st?' selected':'')+'>'+st+'</option>').join('')+'</select><div class="hint">Nový účet čeká na ověření — klient ho ověří prvním přihlášením (simulace e-mailového ověření).</div></div>'+
  '<div class="eyebrow" style="margin:6px 0 6px">Klientská zóna — co klient uvidí</div>'+
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px">'+
  [['cena','Cena a fakturace'],['dokumenty','Dokumenty, výstupy a smlouvy'],['zpravy','Zprávy'],['navody','Návody ke službám']].map(([kz,nm])=>
   '<label style="display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line-2);border-radius:4px;padding:8px 10px;background:var(--white);cursor:pointer"><input type="checkbox" id="pu-z-'+kz+'"'+(zona[kz]?' checked':'')+' style="accent-color:var(--gold-deep)">'+nm+'</label>').join('')+'</div>'+
  '<div class="hint">Průběh projektů vidí klient vždy — to je smysl portálu.</div>';
  const f=(id?'<button class="btn btn-d btn-s" onclick="smazPortalUcet(\''+id+'\')">Smazat účet</button>':'')+
   '<button class="btn btn-o" onclick="zavri()">Zrušit</button><button class="btn btn-g" onclick="ulozPortalUcet(\''+(id||'')+'\')">Uložit</button>';
  modal(id?'Nastavení portálového účtu':'Nový portálový účet',b,f);
}
function ulozPortalUcet(id){
  if(!gv('pu-email')){toast('Vyplň e-mail');return;}
  const o=id?D.portalUcty.find(x=>x.id===id):{id:uid('pu'),klientId:gv('pu-klient'),vytvoreno:dnesISO(),stav:'čeká na ověření'};
  Object.assign(o,{email:gv('pu-email'),kod:gv('pu-kod')||genKod(),stav:gv('pu-stav')||o.stav,
   zona:{cena:gchk('pu-z-cena'),dokumenty:gchk('pu-z-dokumenty'),zpravy:gchk('pu-z-zpravy'),navody:gchk('pu-z-navody')}});
  if(!id)D.portalUcty.push(o);
  uloz();zavri();render();
  toast(id?'Účet uložen':'Účet vytvořen — předej klientovi e-mail a kód '+o.kod);
}
function smazPortalUcet(id){if(!confirm('Smazat portálový účet? Zprávy klienta zůstanou.'))return;
  D.portalUcty=D.portalUcty.filter(u=>u.id!==id);uloz();zavri();render();}

/* ═══ 25. PORTÁL — přihlášení (simulace ověření) ═══ */
function vPortalLogin(){
  return '<div class="login-box"><div class="portal-hero" style="text-align:center"><div class="pm">PARŤÁK</div><div class="pr" style="margin:8px auto 6px"></div><div class="ps">klientská zóna</div></div>'+
  '<div class="portal-note">Demo přihlášení v rámci MVP — funguje na tomto počítači. V ostré verzi (Fáze 1) klient dostane ověřovací e-mail a přihlašuje se odkudkoliv.</div>'+
  '<div class="card"><div class="card-b">'+
  '<div class="f"><label>E-mail</label><input id="pl-email" placeholder="jana@pekarnaunovaku.cz"></div>'+
  '<div class="f"><label>Přístupový kód</label><input id="pl-kod" placeholder="PRT-0000"></div>'+
  '<button class="btn btn-g" style="width:100%;justify-content:center" onclick="portalPrihlasit()">Přihlásit se</button>'+
  '<div class="hint" style="margin-top:8px">První přihlášení účet zároveň ověří (v ostré verzi klik v e-mailu).</div>'+
  '</div></div></div>';
}
function portalPrihlasit(){
  const email=gv('pl-email').toLowerCase(),kod=gv('pl-kod').trim().toUpperCase();
  const u=D.portalUcty.find(x=>x.email.toLowerCase()===email&&String(x.kod).toUpperCase()===kod);
  if(!u){toast('Nesprávný e-mail nebo kód');return;}
  if(u.stav==='zablokován'){toast('Účet je zablokovaný — kontaktujte Parťáka');return;}
  if(u.stav==='čeká na ověření'){u.stav='aktivní';uloz();toast('Účet ověřen a aktivován');}
  PORTAL_SESSION={klientId:u.klientId,ucetId:u.id};
  jdi('portal',u.klientId);
}

/* ═══ 26. PORTÁL — klientská zóna ═══ */
function vPortal(){
  const kid=arg||(PORTAL_SESSION&&PORTAL_SESSION.klientId);
  const k=klient(kid);
  const u=D.portalUcty.find(x=>x.klientId===kid);
  if(!k||!u)return '<div class="empty"><div class="big">Zóna nenalezena</div>Klient nemá portálový účet — vytvoř ho v Admin → Klientský portál.</div>';
  const jakoKlient=!!PORTAL_SESSION;
  const pr=D.projekty.filter(p=>p.klientId===kid&&!p.archiv).sort((a,b)=>{
    const da=a.stav==='Dokončeno'?1:0,db=b.stav==='Dokončeno'?1:0;
    return da-db||String(a.deadline||'9').localeCompare(String(b.deadline||'9'));});
  const vlakno=D.zpravy.filter(z=>z.klientId===kid).sort((a,b)=>String(a.datum).localeCompare(b.datum));
  const sml=D.smlouvy.filter(s=>s.strana==='klient'&&s.stranaId===kid);
  let h='<div class="portal-note">'+(jakoKlient?'Přihlášen jako klient (demo). ':'Náhled zóny očima klienta. ')+'Ostrý provoz se vzdáleným přístupem = Fáze 1 (Supabase). <button class="btn btn-o btn-xs" style="margin-left:6px" onclick="PORTAL_SESSION=null;jdi(\''+(jakoKlient?'portalLogin':'dashboard')+'\')">'+(jakoKlient?'Odhlásit':'Zpět do CRM')+'</button></div>';
  h+='<div class="portal-hero"><div class="pm">PARŤÁK</div><div class="pr"></div>'+
   '<div style="font-family:var(--f-d);font-size:22px;margin-top:10px">'+esc(k.nazev)+'</div>'+
   '<div class="ps" style="margin-top:3px">Vaše zóna — průběh spolupráce na jednom místě'+(k.spravce?' · váš parťák: '+esc((uz(k.spravce)||{}).jmeno||'')+'':'')+'</div></div>';
  /* projekty */
  h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Vaše projekty</h2><span class="sub">'+pr.length+'</span></div><div class="card-b">';
  if(!pr.length)h+='<div class="muted" style="font-size:13px">Zatím žádný projekt.</div>';
  h+=pr.map(p=>{
    const ck=ukolyProjektu(p.id).filter(x=>x.checklist);
    const pct=ck.length?Math.round(ck.filter(x=>x.hotovo).length/ck.length*100):null;
    return '<div style="border:1px solid var(--line);border-radius:4px;padding:13px 15px;margin-bottom:10px;background:var(--white)">'+
    '<div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap"><b style="font-size:14.5px">'+esc(p.nazev)+'</b>'+sluzbyPills(p.sluzby)+pillStav(p.stav)+
    (p.deadline?'<span class="muted" style="font-size:12px;margin-left:auto">termín '+dat(p.deadline)+'</span>':'')+'</div>'+
    '<div style="margin-top:9px">'+fazeBar(p)+'</div>'+
    (pct!=null?'<div style="margin-top:7px;display:flex;align-items:center;gap:9px"><div style="flex:1">'+progress(pct,'okc')+'</div><span class="mono muted" style="font-size:11.5px">'+pct+' % kroků hotovo</span></div>':'')+
    (p.vysledekCil?'<div class="muted" style="font-size:12px;margin-top:7px">Cíl: '+esc(p.vysledekCil)+'</div>':'')+
    '</div>';
  }).join('');
  h+='</div></div>';
  /* cena */
  if(u.zona.cena){
    h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Cena a fakturace</h2></div><table><thead><tr><th>Projekt</th><th class="num">Cena</th><th class="num">Fakturováno</th><th>Stav</th></tr></thead><tbody>';
    h+=pr.map(p=>'<tr><td>'+esc(p.nazev)+'</td><td class="num">'+kc(p.cena)+'</td><td class="num">'+kc(p.fakturovano)+'</td><td style="font-size:12.5px">'+esc(p.stavFakturace||'—')+'</td></tr>').join('')||'<tr><td colspan="4" class="muted">—</td></tr>';
    h+='<tr><td><b>Celkem</b></td><td class="num"><b>'+kc(pr.reduce((s,p)=>s+(+p.cena||0),0))+'</b></td><td class="num"><b>'+kc(pr.reduce((s,p)=>s+(+p.fakturovano||0),0))+'</b></td><td></td></tr>';
    h+='</tbody></table></div>';
  }
  /* dokumenty, výstupy, smlouvy */
  if(u.zona.dokumenty){
    const vystupy=pr.flatMap(p=>(p.vystupy||[]).filter(v=>v.stav==='Schváleno').map(v=>({...v,proj:p.nazev})));
    const doky=pr.flatMap(p=>(p.dokumenty||[]).map(d=>({...d,proj:p.nazev})));
    h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Dokumenty a výstupy</h2></div><div class="card-b">';
    h+='<div class="eyebrow" style="margin-bottom:5px">Schválené výstupy</div>';
    h+=vystupy.map(v=>'<div class="ck"><span>✔</span><div class="t">'+(v.link?'<a href="'+esc(v.link)+'" target="_blank" rel="noopener">'+esc(v.nazev)+'</a>':esc(v.nazev))+'<div class="muted" style="font-size:11.5px">'+esc(v.proj)+'</div></div></div>').join('')||'<div class="muted" style="font-size:12.5px;margin-bottom:6px">Zatím žádné schválené výstupy.</div>';
    h+='<div class="eyebrow" style="margin:10px 0 5px">Dokumenty spolupráce</div>';
    h+=doky.map(d=>'<div class="ck"><span>▭</span><div class="t">'+(d.link?'<a href="'+esc(d.link)+'" target="_blank" rel="noopener">'+esc(d.nazev)+'</a>':esc(d.nazev))+'<div class="muted" style="font-size:11.5px">'+esc(d.typ||'')+' · '+esc(d.proj)+'</div></div></div>').join('')||'<div class="muted" style="font-size:12.5px;margin-bottom:6px">Žádné dokumenty.</div>';
    h+='<div class="eyebrow" style="margin:10px 0 5px">Smlouvy a souhlasy (GDPR, podmínky)</div>';
    h+=sml.map(s=>'<div class="ck"><span>✎</span><div class="t">'+esc(s.typ)+' '+smlStavPill(s.stav)+(s.link?' · <a href="'+esc(s.link)+'" target="_blank" rel="noopener">otevřít</a>':'')+'</div></div>').join('')||'<div class="muted" style="font-size:12.5px">Smlouvy zatím nejsou nahrané.</div>';
    h+='</div></div>';
  }
  /* zprávy */
  if(u.zona.zpravy){
    h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Zprávy</h2><span class="sub">napište nám — úpravy, dotazy, podklady</span></div><div class="card-b">';
    h+='<div class="msgs">'+vlakno.map(z=>'<div class="msg '+(z.od==='klient'?'partak':'klient')+'">'+esc(z.text)+'<div class="mm">'+(z.od==='partak'?'Parťák':'Vy')+' · '+datCasZpravy(z.datum)+'</div></div>').join('')+'</div>';
    if(!vlakno.length)h+='<div class="muted" style="font-size:13px;margin-bottom:6px">Zatím žádné zprávy.</div>';
    h+='<div style="display:flex;gap:8px;margin-top:10px"><input id="po-zprava" placeholder="Napište zprávu… (odkaz na dokument vložte do textu)" style="flex:1;padding:8px 11px;border:1px solid var(--line-2);border-radius:4px;background:var(--white)">'+
     '<button class="btn btn-g btn-s" onclick="portalPosliZpravu(\''+kid+'\')">Odeslat</button></div>';
    h+='<div class="hint" style="margin-top:5px;color:var(--ink-3);font-size:11px">Odpovídáme do 24 hodin v pracovní dny. Dokumenty sdílejte odkazem (Drive, úschovna).</div>';
    h+='</div></div>';
  }
  /* další práce */
  h+='<div class="card" style="margin-bottom:14px"><div class="card-h"><h2>Chci další práci</h2><span class="sub">rozšíření spolupráce</span></div><div class="card-b">'+
   '<div class="f"><label>O co máte zájem</label>'+mselHtml('po-sluzby',[])+'</div>'+
   '<div class="f"><label>Popište, co potřebujete</label><textarea id="po-popis" placeholder="Např. chceme přidat e-shop k webu…" style="min-height:64px"></textarea></div>'+
   '<button class="btn btn-g btn-s" onclick="portalPozadavek(\''+kid+'\')">Odeslat požadavek</button>'+
   '<div class="hint" style="margin-top:6px">Požadavek dorazí vašemu parťákovi — ozve se do 2 pracovních dnů.</div>'+
  '</div></div>';
  /* návody */
  if(u.zona.navody){
    h+='<div class="card"><div class="card-h"><h2>Jak naše služby fungují a co vám přinesou</h2></div><div class="card-b">';
    h+=D.kb.sluzby.map(s=>'<div style="border:1px solid var(--line);border-radius:4px;padding:13px 15px;margin-bottom:10px;background:var(--white)">'+
     '<div style="display:flex;align-items:center;gap:8px"><b style="font-size:14px">'+esc(s.nazev)+'</b><span class="pill p-gold mono">'+esc(s.cena||'')+'</span></div>'+
     (s.resi?'<div style="font-size:13px;margin-top:6px"><span class="eyebrow">Co řeší</span><div>'+esc(s.resi)+'</div></div>':'')+
     (s.prinos?'<div style="font-size:13px;margin-top:6px"><span class="eyebrow">Co vám to přinese</span><div>'+esc(s.prinos)+'</div></div>':'')+
     (s.proces?'<div style="font-size:13px;margin-top:6px"><span class="eyebrow">Jak to probíhá</span><div>'+esc(s.proces)+'</div></div>':'')+
     (s.faq?'<div style="font-size:12.5px;margin-top:6px" class="muted">'+esc(s.faq)+'</div>':'')+
     '</div>').join('')||'<div class="muted" style="font-size:13px">Karty služeb doplň v Knowledge Base.</div>';
    h+='</div></div>';
  }
  return h;
}
function portalPosliZpravu(kid){
  const t=gv('po-zprava');if(!t){toast('Napište text zprávy');return;}
  D.zpravy.push({id:uid('z'),klientId:kid,od:'klient',text:t,datum:new Date().toISOString(),precteno:false});
  uloz();render();toast('Zpráva odeslána Parťákovi');
}
function posliZpravuPartak(kid){
  const t=gv('kz-text');if(!t){toast('Napiš text zprávy');return;}
  D.zpravy.push({id:uid('z'),klientId:kid,od:'partak',autor:D.ja,text:t,datum:new Date().toISOString(),precteno:true});
  uloz();render();toast('Zpráva odeslána do portálu klienta');
}
function portalPozadavek(kid){
  const k=klient(kid);if(!k)return;
  const sluzby=(MSEL['po-sluzby']||[]).slice();
  const popis=gv('po-popis');
  if(!sluzby.length&&!popis){toast('Vyberte službu nebo popište požadavek');return;}
  D.leady.push({id:uid('l'),nazev:'Portál: '+k.nazev,firma:k.nazev,kontakt:k.kontakt||'',email:k.email||'',telefon:k.telefon||'',
   zdroj:'Klientský portál',datum:dnesISO(),faze:'lead',potencialy:sluzby,hodnota:null,
   pozn:'Požadavek z klientského portálu:\n'+(popis||'(bez popisu)'),klientId:kid,
   dalsiKrok:'Ozvat se klientovi',dalsiKrokDatum:plusDni(dnesISO(),2),vlastnik:k.spravce||D.uzivatele[0].id,vytvoreno:dnesISO()});
  uloz();render();
  toast('Požadavek odeslán — parťák se ozve do 2 pracovních dnů');
}

  if(typeof migruj12==='function')migruj12();
